const RULES_I18N={"zh_hant": {"th_rar": ["稀有度", "出現機率", "卡池數量"], "th_src": ["來源", "授權", "卡片數量"], "body": "<h4>卡牌</h4><p>每張卡牌是一位東方歷史人物、神佛、妖怪、神獸，或一件寶物、名馬、神兵、戰役與界域。人物資料來自維基百科，人物圖片使用維基共享資源的公有領域或自由授權圖片；寶物來自各博物館的開放典藏（見下方「授權與出處」）。每張卡都有編號、標題、維基百科或博物館連結、ATK 和 DEF。</p>\n<h4>名望與稀有度</h4><p>「名望」是 0 到 100 的分數，依照條目在多少種語言的維基百科中出現以及瀏覽量計算。稀有度依名望排序分配，名望越高越可能是高稀有度。關羽、孫悟空、織田信長等名人有多個版本，從 C 到 EXR 各不相同。</p>\n{RARTABLE}\n<h4>ATK 與 DEF</h4><p>ATK 與 DEF 由名望和稀有度決定，上限 15,000。每張卡的數值固定，所有玩家都一樣。寶物依博物館典藏的年代與重要性計算。</p>\n<h4>卡包節奏</h4><ul><li>每張卡先決定類別：人物 60%、寶物／神兵 30%、戰場／界域／名馬 10%，再依稀有度抽出。人物再依地區加權：中國 55%、日本 20%、朝鮮半島 10%、東南亞與其他（含神話）15%。</li><li>每包 6 張卡，每張各自抽稀有度，6 張全是 C 也有可能。每 1 分鐘恢復 1 包，最多存 10 包。</li><li>每 10 包有 1 個金卡包：保底 SR 以上。</li><li>每 100 包有 1 個彩虹卡包：保底 SSR 以上。每天第一包也是彩虹卡包。</li><li>每集滿 5 個登入章，當天會有 1 個黑卡包：保底 UR 以上。</li><li>每日任務每完成一項 +2 包。</li><li>限定召喚為期 {BH} 小時，主題卡出現機率提高為 {BB} 倍；每 {BG} 小時一次，倒數結束後開的第一張必定是主題 SSR 以上（SSR／UR／EXR）；累計抽 {BS} 張必得限定卡。</li></ul>\n{ANAT}\n<h4>五行與種族</h4><p>每張卡有五行屬性：預設跟種族走（人族＝木、仙族＝水、妖族＝火、鬼族＝金、龍族＝土），部分名人和寶物有自己的屬性，全卡池五行各約 20%。神族、魔族沒有五行。</p><p>五行相剋：木剋土、土剋水、水剋火、火剋金、金剋木。剋制對手傷害 ×1.2，被剋 ×0.8。神魔互剋 ×1.5。</p><p>隊伍加成：同屬性 3 張 +6%、5 張 +15%；五行俱全 +12%；相鄰相生（木→火→土→金→水→木）+8%；同族 3 張 +5%、5 張 +10%；主題羈絆另計。隊伍第一張是隊長，只有隊長的隊長技會生效，對全隊有效。只有 SR 以上的卡有隊長技。</p>\n<h4>羈絆</h4><p>同族 3 人 +5%，同族 5 人 +10%。歷史羈絆：桃園 3 人 +10%、五虎 5 人 +20%、取經 4 人 +12%、四海龍王、八仙、七福神、四大天王、四凶、四象、梁山等。</p>\n<h4>裝備與戰場</h4><p>每位角色可各裝備 1 件神兵、寶物、名馬。裝備會把本身 ATK／DEF 的 30% 加給角色（裝 2～3 件時各 20%）。寶物、神兵、名馬沒有五行。團體戰可放 1 張戰場卡，效果對雙方都有效。</p>\n<h4>對戰</h4><ul><li>每日首領戰：每天 1 位強力首領，最多編入 50 張卡，每天 3 次。HP 保留到擊敗為止，擊敗獎勵 10 包。</li><li>單人隨機對戰：選 1 張卡，挑戰指定級別的隨機對手。</li><li>團體戰：5 張卡按出戰順序一對一，先取得 3 勝即結束（最多 5 戰）。</li><li>劇情遠征：贏得知識，強化 5 張卡，每 5 關提升一個級別。</li></ul>\n<h4>{CHANGELOG}</h4><ul><li>2026/11/22 v3：正式上線（mylegends.org）；沒有內建圖片的人物卡改為即時載入維基百科圖片，並加上水墨印章底圖；加入台北故宮 28,698 件寶物；出處表更新；人物依地區加權；全服累計開包改為真實數據（從 0 開始）；規則說明支援八種語言。</li><li>2026/11/21 v2：卡包改為撕開式；SSR／UR／EXR 專屬出卡特效；新卡面；本機備份匯出與合併匯入；八種語言；博物館寶物卡；每日首領戰、團體戰、劇情遠征；獎盃。</li><li>2026/11/21 v1：第一版原型。</li></ul>\n<h4>授權與出處</h4><p>卡片文字摘自維基百科，依 <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--gold)\">CC BY-SA 4.0</a> 授權使用並同樣以 CC BY-SA 4.0 分享。圖片與寶物資料來源：</p>{SRCTABLE}<p>人物圖片來自維基共享資源，每張卡的詳情都標示檔案名稱與連結。即將加入：日本 ColBase（國立文化財機構）、Japan Search、國立國會圖書館。本遊戲為非官方作品，與維基百科及各博物館無關。</p>\n<h4>資料</h4><p>資料快照：2026/11/21。遊戲進度只存在你的瀏覽器裡，請到圖鑑頁定期匯出備份。</p>", "anat_h": "卡片解讀", "anat": ["名字（版本卡是「人物・版本名」）", "種族圖示（人、仙、妖、鬼、龍、神、魔）", "五行符號：木、火、土、金、水。神魔和寶物沒有五行", "圖片：公有領域的畫像或博物館文物", "類型行：傳奇（SSR 以上）· 種類 — 主題", "稀有度符號：顏色代表稀有度，C 黑、UC 銀、R 金、SR 藍、SSR 橙紅、UR 珍珠彩、EXR 彩虹", "隊長技（只有 SR 以上才有，隊長＝隊伍第一張）", "介紹：維基百科或博物館的說明", "ATK 攻擊／DEF 防禦", "稀有度、編號、圖片來源（credit）", "連結：點開看維基百科條目或博物館頁面"], "anat_p": "外框顏色就是五行：綠＝木、紅＝火、黃＝土、白＝金、藍＝水。金色多色框是神族，黑曜石框是魔族，銀色是沒有五行的寶物、神兵、名馬。", "src": ["維基百科／維基共享資源", "國立故宮博物院（台北故宮）", "克里夫蘭美術館", "大都會藝術博物館", "CC BY-SA 4.0／公有領域"]}, "en": {"th_rar": ["Rarity", "Drop rate", "Cards in pool"], "th_src": ["Source", "License", "Cards"], "body": "<h4>Cards</h4><p>Every card is a figure from East Asian history, a god, buddha, yokai or mythical beast, or a treasure, famous horse, legendary weapon, battle or realm. Character data comes from Wikipedia and character images are public-domain or freely licensed files from Wikimedia Commons; treasures come from museums' open-access collections (see \"Licenses & sources\" below). Every card has a number, a title, a Wikipedia or museum link, ATK and DEF.</p>\n<h4>Fame and rarity</h4><p>\"Fame\" is a score from 0 to 100 based on how many language editions of Wikipedia have the article and how often it is read. Rarity is assigned by ranking fame, so famous figures are more likely to be rare. Very famous figures such as Guan Yu, Sun Wukong and Oda Nobunaga have several versions, from C up to EXR.</p>\n{RARTABLE}\n<h4>ATK and DEF</h4><p>ATK and DEF come from fame and rarity, up to 15,000. Each card's numbers are fixed and the same for every player. Treasures are scored by the age and importance of the museum object.</p>\n<h4>Pack rhythm</h4><ul><li>Each card first rolls a category: characters 60%, treasures/weapons 30%, battlefields/realms/horses 10%, then a rarity. Characters are also weighted by region: China 55%, Japan 20%, Korea 10%, Southeast Asia and others (incl. myths) 15%.</li><li>6 cards per pack, each rolled on its own, so an all-C pack can happen. You get 1 pack per minute and can store up to 10.</li><li>Every 10th pack is a gold pack: SR or better guaranteed.</li><li>Every 100th pack is a rainbow pack: SSR or better guaranteed. Your first pack each day is also a rainbow pack.</li><li>Every 5 login stamps give a black pack that day: UR or better guaranteed.</li><li>Each daily mission you complete gives +2 packs.</li><li>Limited summons last {BH} hours and theme cards appear {BB}× as often. Every {BG} hours, the first card of the next pack after the countdown is a theme card of SSR or better (SSR/UR/EXR). {BS} pulls guarantee the limited card.</li></ul>\n{ANAT}\n<h4>Five elements and races</h4><p>Every card has one of the five elements (Wood, Fire, Earth, Metal, Water). By default it follows the race (Human = Wood, Immortal = Water, Yokai = Fire, Ghost = Metal, Dragon = Earth); some famous figures and treasures have their own. Each element is about 20% of the pool. Gods and Demons have no element.</p><p>Counters: Wood beats Earth, Earth beats Water, Water beats Fire, Fire beats Metal, Metal beats Wood. Hitting the element you beat does ×1.2 damage; hitting the one that beats you does ×0.8. Gods and Demons counter each other at ×1.5.</p><p>Team bonuses: 3 of the same element +6%, 5 of the same +15%; all five elements +12%; adjacent generating pairs (Wood→Fire→Earth→Metal→Water→Wood) +8%; 3 of the same race +5%, 5 +10%; theme bonds on top. The first card in the team is the leader, and only the leader's skill applies, to the whole team. Only SR and above have a leader skill.</p>\n<h4>Bonds</h4><p>3 of the same race +5%, 5 of the same race +10%. Historical bonds: the Peach Garden trio +10%, the Five Tiger Generals +20%, the Journey to the West pilgrims +12%, the Four Dragon Kings, the Eight Immortals, the Seven Lucky Gods, the Four Heavenly Kings, the Four Fiends, the Four Symbols, the heroes of Liangshan and more.</p>\n<h4>Equipment and battlefields</h4><p>Each character can equip 1 weapon, 1 treasure and 1 horse. Equipment adds 30% of its own ATK/DEF to the character (20% each when wearing 2–3 items). Treasures, weapons and horses have no element. In team battles you can place 1 battlefield card, and its effect applies to both sides.</p>\n<h4>Battles</h4><ul><li>Daily boss: one strong boss a day; bring up to 50 cards, 3 tries a day. Its HP carries over until it is defeated, and defeating it gives 10 packs.</li><li>Solo random battle: pick 1 card and challenge a random opponent of the chosen tier.</li><li>Team battle: 5 cards fight one-on-one in order; first to 3 wins (up to 5 rounds).</li><li>Story expedition: win knowledge, power up 5 cards, and move up a tier every 5 stages.</li></ul>\n<h4>{CHANGELOG}</h4><ul><li>2026/11/22 v3: official launch (mylegends.org); characters without bundled art now load their Wikipedia image live, with an ink-wash seal placeholder; 28,698 National Palace Museum treasures added; sources table updated; region weighting for characters; real worldwide pack counter (started from 0); rules page in eight languages.</li><li>2026/11/21 v2: tear-open packs; SSR/UR/EXR reveal effects; new card frame; local backup export and merge import; eight languages; museum treasure cards; daily boss, team battle, story expedition; trophies.</li><li>2026/11/21 v1: first prototype.</li></ul>\n<h4>Licenses & sources</h4><p>Card text is taken from Wikipedia under <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--gold)\">CC BY-SA 4.0</a> and shared under the same license. Image and treasure data sources:</p>{SRCTABLE}<p>Character images come from Wikimedia Commons; each card's detail view names the file and links to it. Coming soon: Japan's ColBase (National Institutes for Cultural Heritage), Japan Search and the National Diet Library. This is an unofficial fan project, not affiliated with Wikipedia or any museum.</p>\n<h4>Data</h4><p>Data snapshot: 2026/11/21. Your progress is saved only in this browser, so export a backup from the Collection page now and then.</p>", "anat_h": "Reading a card", "anat": ["Name (version cards read \"Figure・Version\")", "Race icon (Human, Immortal, Yokai, Ghost, Dragon, God, Demon)", "Element symbol: Wood, Fire, Earth, Metal, Water. Gods, Demons and treasures have none", "Image: a public-domain portrait or museum object", "Type line: Legendary (SSR and up) · kind — theme", "Rarity symbol: the color shows rarity. C black, UC silver, R gold, SR blue, SSR orange-red, UR pearl, EXR rainbow", "Leader skill (SR and up only; the leader is the first card in the team)", "Description from Wikipedia or the museum", "ATK attack / DEF defense", "Rarity, number, image credit", "Link: open the Wikipedia article or museum page"], "anat_p": "The frame color is the element: green = Wood, red = Fire, yellow = Earth, white = Metal, blue = Water. A gold multicolor frame is a God, an obsidian frame is a Demon, and silver is a treasure, weapon or horse with no element.", "src": ["Wikipedia / Wikimedia Commons", "National Palace Museum, Taipei", "Cleveland Museum of Art", "The Metropolitan Museum of Art", "CC BY-SA 4.0 / public domain"]}, "ja": {"th_rar": ["レアリティ", "排出率", "カード枚数"], "th_src": ["出典", "ライセンス", "カード枚数"], "body": "<h4>カード</h4><p>カードは東アジアの歴史人物、神仏、妖怪、神獣、または宝物・名馬・神兵・合戦・異界です。人物データはウィキペディア、人物画像はウィキメディア・コモンズのパブリックドメインまたは自由ライセンスの画像、宝物は各美術館・博物館のオープンアクセス収蔵品です（下の「ライセンスと出典」参照）。すべてのカードに番号、タイトル、ウィキペディアまたは博物館へのリンク、ATK と DEF があります。</p>\n<h4>名声とレアリティ</h4><p>「名声」は 0〜100 のスコアで、その記事が何言語のウィキペディアにあるかと閲覧数から計算します。レアリティは名声の順位で割り当てられ、有名な人物ほど高レアになりやすくなります。関羽、孫悟空、織田信長などの有名人には C から EXR まで複数のバージョンがあります。</p>\n{RARTABLE}\n<h4>ATK と DEF</h4><p>ATK と DEF は名声とレアリティで決まり、上限は 15,000 です。各カードの数値は固定で、全プレイヤー共通です。宝物は収蔵品の年代と重要度で計算します。</p>\n<h4>パックのリズム</h4><ul><li>各カードはまず種類を決めます：人物 60%、宝物／神兵 30%、戦場／異界／名馬 10%。次にレアリティを抽選します。人物は地域でも重み付けされます：中国 55%、日本 20%、朝鮮半島 10%、東南アジアほか（神話含む）15%。</li><li>1 パック 6 枚、1 枚ずつ独立して抽選するので全部 C もあり得ます。1 分ごとに 1 パック回復し、最大 10 パックまで貯められます。</li><li>10 パックごとに金パック：SR 以上確定。</li><li>100 パックごとに虹パック：SSR 以上確定。毎日最初のパックも虹パックです。</li><li>ログインスタンプ 5 個ごとに、その日に黒パック：UR 以上確定。</li><li>デイリーミッション 1 つ達成ごとに +2 パック。</li><li>限定召喚の期間は {BH} 時間で、テーマカードの出現率は {BB} 倍。{BG} 時間ごとのカウントダウン終了後、次のパックの 1 枚目はテーマの SSR 以上（SSR／UR／EXR）確定。累計 {BS} 枚で限定カード確定。</li></ul>\n{ANAT}\n<h4>五行と種族</h4><p>各カードは五行（木・火・土・金・水）のいずれかを持ちます。基本は種族に従い（人族＝木、仙族＝水、妖族＝火、鬼族＝金、龍族＝土）、一部の有名人や宝物は独自の属性を持ちます。全体で各属性約 20% です。神族・魔族には五行がありません。</p><p>相剋：木は土に、土は水に、水は火に、火は金に、金は木に勝ちます。有利な相手へのダメージ ×1.2、不利なら ×0.8。神族と魔族は互いに ×1.5。</p><p>チームボーナス：同属性 3 枚 +6%、5 枚 +15%；五行すべて +12%；隣り合う相生（木→火→土→金→水→木）+8%；同種族 3 枚 +5%、5 枚 +10%；テーマの絆は別途加算。チームの 1 枚目がリーダーで、リーダースキルのみがチーム全体に有効です。リーダースキルは SR 以上のみ。</p>\n<h4>絆</h4><p>同種族 3 人 +5%、5 人 +10%。歴史の絆：桃園の三兄弟 +10%、五虎大将 +20%、西遊記の一行 +12%、四海竜王、八仙、七福神、四天王、四凶、四神、梁山泊など。</p>\n<h4>装備と戦場</h4><p>各キャラクターは神兵・宝物・名馬を 1 つずつ装備できます。装備は自身の ATK／DEF の 30% をキャラクターに加算します（2〜3 個装備時は各 20%）。宝物・神兵・名馬に五行はありません。チーム戦では戦場カードを 1 枚置け、効果は両陣営に適用されます。</p>\n<h4>バトル</h4><ul><li>デイリーボス：毎日 1 体の強力なボス。最大 50 枚で挑戦、1 日 3 回。HP は撃破まで持ち越し、撃破で 10 パック。</li><li>ソロランダムバトル：1 枚を選び、指定ランクのランダムな相手に挑戦。</li><li>チーム戦：5 枚が順番に 1 対 1 で戦い、先に 3 勝した方の勝ち（最大 5 戦）。</li><li>ストーリー遠征：知識を得て 5 枚を強化、5 ステージごとにランクアップ。</li></ul>\n<h4>{CHANGELOG}</h4><ul><li>2026/11/22 v3：正式公開（mylegends.org）；画像のない人物カードはウィキペディアの画像をその場で読み込み、水墨の印章プレースホルダーを追加；台北故宮の宝物 28,698 点を追加；出典表を更新；人物の地域重み付け；全サーバー累計開封数を実数に（0 から）；ルールページを 8 言語対応。</li><li>2026/11/21 v2：パック開封演出；SSR／UR／EXR 専用演出；新カードデザイン；ローカルバックアップ；8 言語；博物館の宝物カード；デイリーボス、チーム戦、ストーリー遠征；トロフィー。</li><li>2026/11/21 v1：最初のプロトタイプ。</li></ul>\n<h4>ライセンスと出典</h4><p>カードの文章はウィキペディアから <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--gold)\">CC BY-SA 4.0</a> のもとで引用し、同じライセンスで共有しています。画像と宝物データの出典：</p>{SRCTABLE}<p>人物画像はウィキメディア・コモンズから取得し、各カードの詳細にファイル名とリンクを表示しています。今後追加予定：ColBase（国立文化財機構）、ジャパンサーチ、国立国会図書館。本ゲームは非公式のファン作品で、ウィキペディアや各博物館とは関係ありません。</p>\n<h4>データ</h4><p>データ時点：2026/11/21。進行状況はこのブラウザにのみ保存されます。図鑑ページから定期的にバックアップを書き出してください。</p>", "anat_h": "カードの見方", "anat": ["名前（バージョンカードは「人物・バージョン名」）", "種族アイコン（人・仙・妖・鬼・龍・神・魔）", "五行記号：木・火・土・金・水。神魔と宝物にはなし", "画像：パブリックドメインの肖像または博物館の収蔵品", "タイプ行：伝説（SSR 以上）· 種類 — テーマ", "レアリティ記号：色でレアリティを表示。C 黒、UC 銀、R 金、SR 青、SSR 橙赤、UR パール、EXR 虹", "リーダースキル（SR 以上のみ。リーダー＝チームの 1 枚目）", "説明：ウィキペディアまたは博物館の解説", "ATK 攻撃／DEF 防御", "レアリティ、番号、画像クレジット", "リンク：ウィキペディアの記事または博物館のページを開く"], "anat_p": "枠の色が五行です：緑＝木、赤＝火、黄＝土、白＝金、青＝水。金色の多色枠は神族、黒曜石の枠は魔族、銀色は五行のない宝物・神兵・名馬です。", "src": ["ウィキペディア／ウィキメディア・コモンズ", "国立故宮博物院（台北）", "クリーブランド美術館", "メトロポリタン美術館", "CC BY-SA 4.0／パブリックドメイン"]}, "ko": {"th_rar": ["희귀도", "출현 확률", "카드 수"], "th_src": ["출처", "라이선스", "카드 수"], "body": "<h4>카드</h4><p>모든 카드는 동아시아의 역사 인물, 신불, 요괴, 신수, 또는 보물·명마·신병·전투·계역입니다. 인물 정보는 위키백과에서, 인물 이미지는 위키미디어 공용의 퍼블릭 도메인 또는 자유 라이선스 이미지에서 가져왔고, 보물은 각 박물관의 오픈 액세스 소장품입니다(아래 「라이선스와 출처」 참고). 모든 카드에는 번호, 제목, 위키백과 또는 박물관 링크, ATK와 DEF가 있습니다.</p>\n<h4>명성과 희귀도</h4><p>「명성」은 0~100 점수로, 해당 문서가 몇 개 언어의 위키백과에 있는지와 조회수로 계산합니다. 희귀도는 명성 순위로 배정되므로 유명한 인물일수록 높은 희귀도가 되기 쉽습니다. 관우, 손오공, 오다 노부나가 같은 유명 인물은 C부터 EXR까지 여러 버전이 있습니다.</p>\n{RARTABLE}\n<h4>ATK와 DEF</h4><p>ATK와 DEF는 명성과 희귀도로 정해지며 최대 15,000입니다. 각 카드의 수치는 고정되어 모든 플레이어에게 같습니다. 보물은 소장품의 연대와 중요도로 계산합니다.</p>\n<h4>팩 리듬</h4><ul><li>각 카드는 먼저 종류를 정합니다: 인물 60%, 보물/신병 30%, 전장/계역/명마 10%, 그다음 희귀도를 뽑습니다. 인물은 지역별 가중치도 있습니다: 중국 55%, 일본 20%, 한반도 10%, 동남아시아 및 기타(신화 포함) 15%.</li><li>한 팩에 6장, 각 장을 따로 뽑으므로 전부 C도 나올 수 있습니다. 1분마다 1팩이 회복되고 최대 10팩까지 모을 수 있습니다.</li><li>10팩마다 금색 팩: SR 이상 확정.</li><li>100팩마다 무지개 팩: SSR 이상 확정. 매일 첫 팩도 무지개 팩입니다.</li><li>출석 도장 5개마다 그날 검은 팩: UR 이상 확정.</li><li>일일 미션 하나를 완료할 때마다 +2팩.</li><li>한정 소환은 {BH}시간 동안 진행되며 테마 카드 출현율이 {BB}배가 됩니다. {BG}시간마다 카운트다운이 끝난 뒤 다음 팩의 첫 장은 테마 SSR 이상(SSR/UR/EXR) 확정. 누적 {BS}장이면 한정 카드 확정.</li></ul>\n{ANAT}\n<h4>오행과 종족</h4><p>모든 카드는 오행(목·화·토·금·수) 중 하나를 가집니다. 기본은 종족을 따르고(인족=목, 선족=수, 요족=화, 귀족=금, 용족=토), 일부 유명 인물과 보물은 고유 속성을 가집니다. 전체에서 각 속성은 약 20%입니다. 신족과 마족은 오행이 없습니다.</p><p>상극: 목은 토를, 토는 수를, 수는 화를, 화는 금을, 금은 목을 이깁니다. 유리한 상대에게 피해 ×1.2, 불리하면 ×0.8. 신족과 마족은 서로 ×1.5.</p><p>팀 보너스: 같은 속성 3장 +6%, 5장 +15%; 오행 모두 +12%; 이웃한 상생(목→화→토→금→수→목) +8%; 같은 종족 3장 +5%, 5장 +10%; 테마 인연은 별도. 팀의 첫 번째 카드가 리더이며 리더 스킬만 팀 전체에 적용됩니다. 리더 스킬은 SR 이상만 있습니다.</p>\n<h4>인연</h4><p>같은 종족 3명 +5%, 5명 +10%. 역사 인연: 도원결의 3인 +10%, 오호대장 +20%, 서유기 일행 +12%, 사해용왕, 팔선, 칠복신, 사천왕, 사흉, 사신, 양산박 등.</p>\n<h4>장비와 전장</h4><p>각 캐릭터는 신병·보물·명마를 하나씩 장착할 수 있습니다. 장비는 자신의 ATK/DEF의 30%를 캐릭터에 더합니다(2~3개 장착 시 각 20%). 보물·신병·명마에는 오행이 없습니다. 팀전에서는 전장 카드 1장을 놓을 수 있으며 효과는 양쪽 모두에 적용됩니다.</p>\n<h4>대전</h4><ul><li>일일 보스: 매일 강력한 보스 1명. 최대 50장으로 하루 3번 도전. HP는 격파할 때까지 유지되고 격파 보상은 10팩.</li><li>솔로 랜덤 대전: 카드 1장을 골라 지정한 등급의 무작위 상대에게 도전.</li><li>팀전: 5장이 순서대로 1대1로 싸워 먼저 3승하면 승리(최대 5전).</li><li>스토리 원정: 지식을 얻고 5장을 강화하며 5스테이지마다 등급이 오릅니다.</li></ul>\n<h4>{CHANGELOG}</h4><ul><li>2026/11/22 v3: 정식 출시(mylegends.org); 이미지가 없는 인물 카드는 위키백과 이미지를 실시간으로 불러오고 수묵 낙관 자리표시 이미지 추가; 타이베이 고궁박물원 보물 28,698점 추가; 출처 표 갱신; 인물 지역 가중치; 전 서버 누적 개봉 수를 실제 데이터로(0부터); 규칙 페이지 8개 언어 지원.</li><li>2026/11/21 v2: 팩 개봉 연출; SSR/UR/EXR 전용 연출; 새 카드 디자인; 로컬 백업; 8개 언어; 박물관 보물 카드; 일일 보스, 팀전, 스토리 원정; 트로피.</li><li>2026/11/21 v1: 첫 프로토타입.</li></ul>\n<h4>라이선스와 출처</h4><p>카드 문구는 위키백과에서 <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--gold)\">CC BY-SA 4.0</a> 라이선스로 가져와 같은 라이선스로 공유합니다. 이미지와 보물 데이터 출처:</p>{SRCTABLE}<p>인물 이미지는 위키미디어 공용에서 가져오며, 각 카드 상세 화면에 파일 이름과 링크를 표시합니다. 추가 예정: 일본 ColBase(국립문화재기구), Japan Search, 국립국회도서관. 이 게임은 비공식 팬 프로젝트이며 위키백과나 각 박물관과 관련이 없습니다.</p>\n<h4>데이터</h4><p>데이터 기준일: 2026/11/21. 진행 상황은 이 브라우저에만 저장되므로 도감 페이지에서 정기적으로 백업을 내보내세요.</p>", "anat_h": "카드 읽는 법", "anat": ["이름(버전 카드는 「인물・버전명」)", "종족 아이콘(인·선·요·귀·용·신·마)", "오행 기호: 목·화·토·금·수. 신·마족과 보물은 없음", "이미지: 퍼블릭 도메인 초상화 또는 박물관 소장품", "유형 줄: 전설(SSR 이상) · 종류 — 테마", "희귀도 기호: 색으로 희귀도 표시. C 검정, UC 은색, R 금색, SR 파랑, SSR 주황빨강, UR 진주, EXR 무지개", "리더 스킬(SR 이상만. 리더=팀의 첫 번째 카드)", "설명: 위키백과 또는 박물관 해설", "ATK 공격 / DEF 방어", "희귀도, 번호, 이미지 출처", "링크: 위키백과 문서나 박물관 페이지 열기"], "anat_p": "테두리 색이 오행입니다: 초록=목, 빨강=화, 노랑=토, 흰색=금, 파랑=수. 금색 다색 테두리는 신족, 흑요석 테두리는 마족, 은색은 오행이 없는 보물·신병·명마입니다.", "src": ["위키백과 / 위키미디어 공용", "국립고궁박물원(타이베이)", "클리블랜드 미술관", "메트로폴리탄 미술관", "CC BY-SA 4.0 / 퍼블릭 도메인"]}, "es": {"th_rar": ["Rareza", "Probabilidad", "Cartas"], "th_src": ["Fuente", "Licencia", "Cartas"], "body": "<h4>Cartas</h4><p>Cada carta es una figura de la historia de Asia oriental, un dios, buda, yokai o bestia mítica, o bien un tesoro, caballo famoso, arma legendaria, batalla o reino. Los datos de personajes vienen de Wikipedia y sus imágenes son archivos de dominio público o con licencia libre de Wikimedia Commons; los tesoros proceden de colecciones de acceso abierto de museos (ver «Licencias y fuentes»). Cada carta tiene número, título, enlace a Wikipedia o al museo, ATK y DEF.</p>\n<h4>Fama y rareza</h4><p>La «fama» es una puntuación de 0 a 100 según en cuántos idiomas de Wikipedia existe el artículo y cuánto se lee. La rareza se asigna por orden de fama, así que las figuras famosas tienden a ser más raras. Figuras muy conocidas como Guan Yu, Sun Wukong u Oda Nobunaga tienen varias versiones, de C a EXR.</p>\n{RARTABLE}\n<h4>ATK y DEF</h4><p>ATK y DEF dependen de la fama y la rareza, con un máximo de 15.000. Los valores de cada carta son fijos e iguales para todos. Los tesoros se puntúan por la antigüedad e importancia de la pieza.</p>\n<h4>Ritmo de sobres</h4><ul><li>Cada carta sortea primero la categoría: personajes 60%, tesoros/armas 30%, campos de batalla/reinos/caballos 10%; luego la rareza. Los personajes también se ponderan por región: China 55%, Japón 20%, Corea 10%, Sudeste Asiático y otros (incl. mitos) 15%.</li><li>6 cartas por sobre, cada una sorteada por separado: puede salir un sobre todo C. Recuperas 1 sobre por minuto, hasta 10.</li><li>Cada 10 sobres, un sobre dorado: SR o superior garantizada.</li><li>Cada 100 sobres, un sobre arcoíris: SSR o superior garantizada. El primer sobre de cada día también es arcoíris.</li><li>Cada 5 sellos de inicio de sesión, ese día un sobre negro: UR o superior garantizada.</li><li>Cada misión diaria completada da +2 sobres.</li><li>La invocación limitada dura {BH} horas y las cartas del tema salen {BB} veces más. Cada {BG} horas, al acabar la cuenta atrás, la primera carta del siguiente sobre es del tema y SSR o superior (SSR/UR/EXR). Con {BS} cartas tienes garantizada la carta limitada.</li></ul>\n{ANAT}\n<h4>Cinco elementos y razas</h4><p>Cada carta tiene uno de los cinco elementos (Madera, Fuego, Tierra, Metal, Agua). Por defecto sigue a la raza (Humano = Madera, Inmortal = Agua, Yokai = Fuego, Fantasma = Metal, Dragón = Tierra); algunas figuras famosas y tesoros tienen el suyo. Cada elemento es cerca del 20% del total. Dioses y Demonios no tienen elemento.</p><p>Ventajas: Madera vence a Tierra, Tierra a Agua, Agua a Fuego, Fuego a Metal, Metal a Madera. Contra el elemento que vences haces ×1,2 de daño; contra el que te vence, ×0,8. Dioses y Demonios se contrarrestan a ×1,5.</p><p>Bonos de equipo: 3 del mismo elemento +6%, 5 +15%; los cinco elementos +12%; pares que se generan (Madera→Fuego→Tierra→Metal→Agua→Madera) +8%; 3 de la misma raza +5%, 5 +10%; los vínculos temáticos se suman aparte. La primera carta es el líder y solo su habilidad se aplica, a todo el equipo. Solo SR y superiores tienen habilidad de líder.</p>\n<h4>Vínculos</h4><p>3 de la misma raza +5%, 5 +10%. Vínculos históricos: el juramento del Jardín de Melocotones +10%, los Cinco Generales Tigre +20%, los peregrinos de Viaje al Oeste +12%, los Cuatro Reyes Dragón, los Ocho Inmortales, los Siete Dioses de la Fortuna, los Cuatro Reyes Celestiales, los Cuatro Malvados, los Cuatro Símbolos, los héroes de Liangshan y más.</p>\n<h4>Equipo y campos de batalla</h4><p>Cada personaje puede equipar 1 arma, 1 tesoro y 1 caballo. El equipo suma el 30% de su propio ATK/DEF al personaje (20% cada uno con 2–3 objetos). Tesoros, armas y caballos no tienen elemento. En batallas de equipo puedes poner 1 carta de campo de batalla, que afecta a ambos bandos.</p>\n<h4>Batallas</h4><ul><li>Jefe diario: un jefe fuerte al día; hasta 50 cartas, 3 intentos diarios. Su PV se mantiene hasta derrotarlo, y derrotarlo da 10 sobres.</li><li>Duelo aleatorio: elige 1 carta y reta a un rival aleatorio del nivel elegido.</li><li>Batalla de equipo: 5 cartas luchan uno contra uno por orden; gana quien llegue a 3 victorias (máx. 5 rondas).</li><li>Expedición: gana conocimiento, mejora 5 cartas y sube de nivel cada 5 etapas.</li></ul>\n<h4>{CHANGELOG}</h4><ul><li>2026/11/22 v3: lanzamiento oficial (mylegends.org); los personajes sin imagen cargan en vivo la de Wikipedia, con un fondo de sello a tinta; 28.698 tesoros del Museo del Palacio Nacional; tabla de fuentes actualizada; ponderación por región; contador mundial real de sobres (desde 0); reglas en ocho idiomas.</li><li>2026/11/21 v2: sobres que se rasgan; efectos SSR/UR/EXR; nuevo marco de carta; copia de seguridad local; ocho idiomas; cartas de tesoros de museo; jefe diario, batalla de equipo, expedición; trofeos.</li><li>2026/11/21 v1: primer prototipo.</li></ul>\n<h4>Licencias y fuentes</h4><p>El texto de las cartas procede de Wikipedia bajo <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--gold)\">CC BY-SA 4.0</a> y se comparte con la misma licencia. Fuentes de imágenes y tesoros:</p>{SRCTABLE}<p>Las imágenes de personajes vienen de Wikimedia Commons; el detalle de cada carta indica el archivo y lo enlaza. Próximamente: ColBase de Japón, Japan Search y la Biblioteca Nacional de la Dieta. Este es un proyecto no oficial de aficionados, sin relación con Wikipedia ni con ningún museo.</p>\n<h4>Datos</h4><p>Datos a fecha de 2026/11/21. Tu progreso solo se guarda en este navegador; exporta una copia desde la Colección de vez en cuando.</p>", "anat_h": "Cómo leer una carta", "anat": ["Nombre (las versiones dicen «Figura・Versión»)", "Icono de raza (Humano, Inmortal, Yokai, Fantasma, Dragón, Dios, Demonio)", "Símbolo de elemento: Madera, Fuego, Tierra, Metal, Agua. Dioses, Demonios y tesoros no tienen", "Imagen: retrato de dominio público u objeto de museo", "Línea de tipo: Legendaria (SSR o más) · clase — tema", "Símbolo de rareza: el color indica la rareza. C negro, UC plata, R oro, SR azul, SSR naranja-rojo, UR perla, EXR arcoíris", "Habilidad de líder (solo SR o más; el líder es la primera carta del equipo)", "Descripción de Wikipedia o del museo", "ATK ataque / DEF defensa", "Rareza, número, crédito de imagen", "Enlace al artículo de Wikipedia o a la página del museo"], "anat_p": "El color del marco es el elemento: verde = Madera, rojo = Fuego, amarillo = Tierra, blanco = Metal, azul = Agua. Un marco dorado multicolor es un Dios, uno de obsidiana un Demonio, y el plateado es un tesoro, arma o caballo sin elemento.", "src": ["Wikipedia / Wikimedia Commons", "Museo del Palacio Nacional, Taipéi", "Museo de Arte de Cleveland", "Museo Metropolitano de Arte", "CC BY-SA 4.0 / dominio público"]}, "fr": {"th_rar": ["Rareté", "Taux", "Cartes"], "th_src": ["Source", "Licence", "Cartes"], "body": "<h4>Cartes</h4><p>Chaque carte est une figure de l'histoire d'Asie de l'Est, un dieu, bouddha, yokai ou animal mythique, ou bien un trésor, un cheval célèbre, une arme légendaire, une bataille ou un royaume. Les données des personnages viennent de Wikipédia et leurs images sont des fichiers du domaine public ou sous licence libre de Wikimedia Commons ; les trésors proviennent des collections en libre accès des musées (voir « Licences et sources »). Chaque carte a un numéro, un titre, un lien vers Wikipédia ou le musée, une ATK et une DEF.</p>\n<h4>Renommée et rareté</h4><p>La « renommée » est un score de 0 à 100 selon le nombre de langues de Wikipédia qui ont l'article et sa fréquentation. La rareté est attribuée par classement de renommée : les figures célèbres ont plus de chances d'être rares. Les très célèbres, comme Guan Yu, Sun Wukong ou Oda Nobunaga, ont plusieurs versions, de C à EXR.</p>\n{RARTABLE}\n<h4>ATK et DEF</h4><p>L'ATK et la DEF dépendent de la renommée et de la rareté, jusqu'à 15 000. Les valeurs de chaque carte sont fixes et identiques pour tous. Les trésors sont notés selon l'âge et l'importance de l'objet.</p>\n<h4>Rythme des paquets</h4><ul><li>Chaque carte tire d'abord une catégorie : personnages 60 %, trésors/armes 30 %, champs de bataille/royaumes/chevaux 10 %, puis une rareté. Les personnages sont aussi pondérés par région : Chine 55 %, Japon 20 %, Corée 10 %, Asie du Sud-Est et autres (mythes inclus) 15 %.</li><li>6 cartes par paquet, tirées séparément : un paquet tout en C est possible. Vous récupérez 1 paquet par minute, jusqu'à 10.</li><li>Tous les 10 paquets, un paquet doré : SR ou mieux garanti.</li><li>Tous les 100 paquets, un paquet arc-en-ciel : SSR ou mieux garanti. Le premier paquet du jour est aussi arc-en-ciel.</li><li>Tous les 5 tampons de connexion, un paquet noir ce jour-là : UR ou mieux garanti.</li><li>Chaque mission quotidienne accomplie donne +2 paquets.</li><li>L'invocation limitée dure {BH} heures et les cartes du thème sortent {BB} fois plus. Toutes les {BG} heures, à la fin du compte à rebours, la première carte du paquet suivant est une carte du thème SSR ou mieux (SSR/UR/EXR). {BS} cartes garantissent la carte limitée.</li></ul>\n{ANAT}\n<h4>Cinq éléments et races</h4><p>Chaque carte a un des cinq éléments (Bois, Feu, Terre, Métal, Eau). Par défaut il suit la race (Humain = Bois, Immortel = Eau, Yokai = Feu, Fantôme = Métal, Dragon = Terre) ; certaines figures célèbres et certains trésors ont le leur. Chaque élément représente environ 20 % des cartes. Dieux et Démons n'ont pas d'élément.</p><p>Avantages : le Bois bat la Terre, la Terre l'Eau, l'Eau le Feu, le Feu le Métal, le Métal le Bois. Contre l'élément que vous battez : dégâts ×1,2 ; contre celui qui vous bat : ×0,8. Dieux et Démons se contrent à ×1,5.</p><p>Bonus d'équipe : 3 du même élément +6 %, 5 +15 % ; les cinq éléments +12 % ; paires qui s'engendrent (Bois→Feu→Terre→Métal→Eau→Bois) +8 % ; 3 de la même race +5 %, 5 +10 % ; liens thématiques en plus. La première carte est le chef, et seule sa compétence s'applique, à toute l'équipe. Seules les SR et plus ont une compétence de chef.</p>\n<h4>Liens</h4><p>3 de la même race +5 %, 5 +10 %. Liens historiques : le serment du Jardin des pêchers +10 %, les Cinq Généraux Tigres +20 %, les pèlerins du Voyage vers l'Ouest +12 %, les Quatre Rois Dragons, les Huit Immortels, les Sept Dieux du Bonheur, les Quatre Rois Célestes, les Quatre Fléaux, les Quatre Symboles, les héros du Liangshan, etc.</p>\n<h4>Équipement et champs de bataille</h4><p>Chaque personnage peut équiper 1 arme, 1 trésor et 1 cheval. L'équipement ajoute 30 % de sa propre ATK/DEF au personnage (20 % chacun avec 2–3 objets). Trésors, armes et chevaux n'ont pas d'élément. En combat d'équipe, vous pouvez poser 1 carte de champ de bataille, qui agit sur les deux camps.</p>\n<h4>Combats</h4><ul><li>Boss du jour : un boss puissant par jour ; jusqu'à 50 cartes, 3 essais par jour. Ses PV restent jusqu'à sa défaite, qui rapporte 10 paquets.</li><li>Duel aléatoire : choisissez 1 carte et défiez un adversaire aléatoire du rang choisi.</li><li>Combat d'équipe : 5 cartes s'affrontent en un contre un dans l'ordre ; le premier à 3 victoires gagne (5 manches max.).</li><li>Expédition : gagnez du savoir, renforcez 5 cartes et montez d'un rang toutes les 5 étapes.</li></ul>\n<h4>{CHANGELOG}</h4><ul><li>2026/11/22 v3 : lancement officiel (mylegends.org) ; les personnages sans image chargent en direct celle de Wikipédia, avec un fond de sceau à l'encre ; 28 698 trésors du Musée national du Palais ; tableau des sources mis à jour ; pondération par région ; vrai compteur mondial de paquets (depuis 0) ; règles en huit langues.</li><li>2026/11/21 v2 : paquets à déchirer ; effets SSR/UR/EXR ; nouveau cadre de carte ; sauvegarde locale ; huit langues ; cartes de trésors de musée ; boss du jour, combat d'équipe, expédition ; trophées.</li><li>2026/11/21 v1 : premier prototype.</li></ul>\n<h4>Licences et sources</h4><p>Le texte des cartes provient de Wikipédia sous <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--gold)\">CC BY-SA 4.0</a> et est partagé sous la même licence. Sources des images et des trésors :</p>{SRCTABLE}<p>Les images des personnages viennent de Wikimedia Commons ; le détail de chaque carte nomme le fichier et le lie. Bientôt : ColBase (Japon), Japan Search et la Bibliothèque nationale de la Diète. Ce projet de fan non officiel n'est affilié ni à Wikipédia ni à aucun musée.</p>\n<h4>Données</h4><p>Données au 2026/11/21. Votre progression n'est enregistrée que dans ce navigateur : exportez régulièrement une sauvegarde depuis la Collection.</p>", "anat_h": "Lire une carte", "anat": ["Nom (les versions indiquent « Figure・Version »)", "Icône de race (Humain, Immortel, Yokai, Fantôme, Dragon, Dieu, Démon)", "Symbole d'élément : Bois, Feu, Terre, Métal, Eau. Dieux, Démons et trésors n'en ont pas", "Image : portrait du domaine public ou objet de musée", "Ligne de type : Légendaire (SSR et plus) · catégorie — thème", "Symbole de rareté : la couleur indique la rareté. C noir, UC argent, R or, SR bleu, SSR orange-rouge, UR nacre, EXR arc-en-ciel", "Compétence de chef (SR et plus ; le chef est la première carte de l'équipe)", "Description de Wikipédia ou du musée", "ATK attaque / DEF défense", "Rareté, numéro, crédit de l'image", "Lien vers l'article Wikipédia ou la page du musée"], "anat_p": "La couleur du cadre est l'élément : vert = Bois, rouge = Feu, jaune = Terre, blanc = Métal, bleu = Eau. Un cadre doré multicolore est un Dieu, un cadre d'obsidienne un Démon, et l'argent un trésor, une arme ou un cheval sans élément.", "src": ["Wikipédia / Wikimedia Commons", "Musée national du Palais, Taipei", "Cleveland Museum of Art", "Metropolitan Museum of Art", "CC BY-SA 4.0 / domaine public"]}, "pt": {"th_rar": ["Raridade", "Chance", "Cartas"], "th_src": ["Fonte", "Licença", "Cartas"], "body": "<h4>Cartas</h4><p>Cada carta é uma figura da história do Leste Asiático, um deus, buda, yokai ou fera mítica, ou então um tesouro, cavalo famoso, arma lendária, batalha ou reino. Os dados dos personagens vêm da Wikipédia e as imagens são arquivos de domínio público ou de licença livre do Wikimedia Commons; os tesouros vêm de acervos abertos de museus (veja «Licenças e fontes»). Toda carta tem número, título, link para a Wikipédia ou o museu, ATK e DEF.</p>\n<h4>Fama e raridade</h4><p>«Fama» é uma pontuação de 0 a 100 baseada em quantos idiomas da Wikipédia têm o artigo e em quantas leituras ele recebe. A raridade é atribuída pela ordem de fama, então figuras famosas tendem a ser mais raras. Figuras muito conhecidas, como Guan Yu, Sun Wukong e Oda Nobunaga, têm várias versões, de C a EXR.</p>\n{RARTABLE}\n<h4>ATK e DEF</h4><p>ATK e DEF dependem da fama e da raridade, até 15.000. Os valores de cada carta são fixos e iguais para todos. Tesouros são pontuados pela idade e importância da peça.</p>\n<h4>Ritmo dos pacotes</h4><ul><li>Cada carta sorteia primeiro a categoria: personagens 60%, tesouros/armas 30%, campos de batalha/reinos/cavalos 10%; depois a raridade. Personagens também têm peso por região: China 55%, Japão 20%, Coreia 10%, Sudeste Asiático e outros (incl. mitos) 15%.</li><li>6 cartas por pacote, cada uma sorteada à parte: pode vir um pacote só de C. Você recupera 1 pacote por minuto, até 10.</li><li>A cada 10 pacotes, um pacote dourado: SR ou melhor garantida.</li><li>A cada 100 pacotes, um pacote arco-íris: SSR ou melhor garantida. O primeiro pacote do dia também é arco-íris.</li><li>A cada 5 selos de login, um pacote preto naquele dia: UR ou melhor garantida.</li><li>Cada missão diária concluída dá +2 pacotes.</li><li>A invocação limitada dura {BH} horas e as cartas do tema saem {BB}× mais. A cada {BG} horas, ao fim da contagem, a primeira carta do próximo pacote é do tema e SSR ou melhor (SSR/UR/EXR). {BS} cartas garantem a carta limitada.</li></ul>\n{ANAT}\n<h4>Cinco elementos e raças</h4><p>Cada carta tem um dos cinco elementos (Madeira, Fogo, Terra, Metal, Água). Por padrão segue a raça (Humano = Madeira, Imortal = Água, Yokai = Fogo, Fantasma = Metal, Dragão = Terra); algumas figuras famosas e tesouros têm o seu. Cada elemento é cerca de 20% do total. Deuses e Demônios não têm elemento.</p><p>Vantagens: Madeira vence Terra, Terra vence Água, Água vence Fogo, Fogo vence Metal, Metal vence Madeira. Contra o elemento que você vence, dano ×1,2; contra o que vence você, ×0,8. Deuses e Demônios se anulam a ×1,5.</p><p>Bônus de equipe: 3 do mesmo elemento +6%, 5 +15%; os cinco elementos +12%; pares que se geram (Madeira→Fogo→Terra→Metal→Água→Madeira) +8%; 3 da mesma raça +5%, 5 +10%; laços temáticos à parte. A primeira carta é o líder, e só a habilidade dele vale, para a equipe toda. Só SR ou acima têm habilidade de líder.</p>\n<h4>Laços</h4><p>3 da mesma raça +5%, 5 +10%. Laços históricos: o juramento do Jardim de Pessegueiros +10%, os Cinco Generais Tigre +20%, os peregrinos da Jornada ao Oeste +12%, os Quatro Reis Dragão, os Oito Imortais, os Sete Deuses da Sorte, os Quatro Reis Celestiais, os Quatro Malignos, os Quatro Símbolos, os heróis de Liangshan e mais.</p>\n<h4>Equipamento e campos de batalha</h4><p>Cada personagem pode equipar 1 arma, 1 tesouro e 1 cavalo. O equipamento soma 30% do próprio ATK/DEF ao personagem (20% cada com 2–3 itens). Tesouros, armas e cavalos não têm elemento. Em batalhas de equipe você pode colocar 1 carta de campo de batalha, que vale para os dois lados.</p>\n<h4>Batalhas</h4><ul><li>Chefe diário: um chefe forte por dia; até 50 cartas, 3 tentativas por dia. O HP dele continua até ser derrotado, e a vitória dá 10 pacotes.</li><li>Duelo aleatório: escolha 1 carta e desafie um oponente aleatório do nível escolhido.</li><li>Batalha de equipe: 5 cartas lutam um contra um em ordem; vence quem fizer 3 vitórias primeiro (até 5 rodadas).</li><li>Expedição: ganhe conhecimento, fortaleça 5 cartas e suba de nível a cada 5 fases.</li></ul>\n<h4>{CHANGELOG}</h4><ul><li>2026/11/22 v3: lançamento oficial (mylegends.org); personagens sem imagem carregam ao vivo a da Wikipédia, com um fundo de selo a nanquim; 28.698 tesouros do Museu do Palácio Nacional; tabela de fontes atualizada; peso por região; contador mundial real de pacotes (desde 0); regras em oito idiomas.</li><li>2026/11/21 v2: pacotes de rasgar; efeitos SSR/UR/EXR; nova moldura de carta; backup local; oito idiomas; cartas de tesouros de museu; chefe diário, batalha de equipe, expedição; troféus.</li><li>2026/11/21 v1: primeiro protótipo.</li></ul>\n<h4>Licenças e fontes</h4><p>O texto das cartas vem da Wikipédia sob <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--gold)\">CC BY-SA 4.0</a> e é compartilhado sob a mesma licença. Fontes de imagens e tesouros:</p>{SRCTABLE}<p>As imagens de personagens vêm do Wikimedia Commons; o detalhe de cada carta mostra o arquivo e o link. Em breve: ColBase (Japão), Japan Search e a Biblioteca Nacional da Dieta. Este é um projeto não oficial de fãs, sem vínculo com a Wikipédia ou com qualquer museu.</p>\n<h4>Dados</h4><p>Dados de 2026/11/21. Seu progresso fica salvo só neste navegador; exporte um backup pela Coleção de vez em quando.</p>", "anat_h": "Como ler uma carta", "anat": ["Nome (versões aparecem como «Figura・Versão»)", "Ícone de raça (Humano, Imortal, Yokai, Fantasma, Dragão, Deus, Demônio)", "Símbolo de elemento: Madeira, Fogo, Terra, Metal, Água. Deuses, Demônios e tesouros não têm", "Imagem: retrato de domínio público ou peça de museu", "Linha de tipo: Lendária (SSR ou acima) · tipo — tema", "Símbolo de raridade: a cor indica a raridade. C preto, UC prata, R ouro, SR azul, SSR laranja-vermelho, UR pérola, EXR arco-íris", "Habilidade de líder (só SR ou acima; o líder é a primeira carta da equipe)", "Descrição da Wikipédia ou do museu", "ATK ataque / DEF defesa", "Raridade, número, crédito da imagem", "Link para o artigo da Wikipédia ou a página do museu"], "anat_p": "A cor da moldura é o elemento: verde = Madeira, vermelho = Fogo, amarelo = Terra, branco = Metal, azul = Água. Moldura dourada multicolorida é Deus, de obsidiana é Demônio, e prateada é tesouro, arma ou cavalo sem elemento.", "src": ["Wikipédia / Wikimedia Commons", "Museu do Palácio Nacional, Taipé", "Museu de Arte de Cleveland", "Museu Metropolitano de Arte", "CC BY-SA 4.0 / domínio público"]}, "zh_hans": {"th_rar": ["稀有度", "出现机率", "卡池数量"], "th_src": ["来源", "授权", "卡片数量"], "body": "<h4>卡牌</h4><p>每张卡牌是一位东方历史人物、神佛、妖怪、神兽，或一件宝物、名马、神兵、战役与界域。人物资料来自维基百科，人物图片使用维基共享资源的公有领域或自由授权图片；宝物来自各博物馆的开放典藏（见下方「授权与出处」）。每张卡都有编号、标题、维基百科或博物馆连结、ATK 和 DEF。</p>\n<h4>名望与稀有度</h4><p>「名望」是 0 到 100 的分数，依照条目在多少种语言的维基百科中出现以及浏览量计算。稀有度依名望排序分配，名望越高越可能是高稀有度。关羽、孙悟空、织田信长等名人有多个版本，从 C 到 EXR 各不相同。</p>\n{RARTABLE}\n<h4>ATK 与 DEF</h4><p>ATK 与 DEF 由名望和稀有度决定，上限 15,000。每张卡的数值固定，所有玩家都一样。宝物依博物馆典藏的年代与重要性计算。</p>\n<h4>卡包节奏</h4><ul><li>每张卡先决定类别：人物 60%、宝物／神兵 30%、战场／界域／名马 10%，再依稀有度抽出。人物再依地区加权：中国 55%、日本 20%、朝鲜半岛 10%、东南亚与其他（含神话）15%。</li><li>每包 6 张卡，每张各自抽稀有度，6 张全是 C 也有可能。每 1 分钟恢复 1 包，最多存 10 包。</li><li>每 10 包有 1 个金卡包：保底 SR 以上。</li><li>每 100 包有 1 个彩虹卡包：保底 SSR 以上。每天第一包也是彩虹卡包。</li><li>每集满 5 个登入章，当天会有 1 个黑卡包：保底 UR 以上。</li><li>每日任务每完成一项 +2 包。</li><li>限定召唤为期 {BH} 小时，主题卡出现机率提高为 {BB} 倍；每 {BG} 小时一次，倒数结束后开的第一张必定是主题 SSR 以上（SSR／UR／EXR）；累计抽 {BS} 张必得限定卡。</li></ul>\n{ANAT}\n<h4>五行与种族</h4><p>每张卡有五行属性：预设跟种族走（人族＝木、仙族＝水、妖族＝火、鬼族＝金、龙族＝土），部分名人和宝物有自己的属性，全卡池五行各约 20%。神族、魔族没有五行。</p><p>五行相克：木克土、土克水、水克火、火克金、金克木。克制对手伤害 ×1.2，被克 ×0.8。神魔互克 ×1.5。</p><p>队伍加成：同属性 3 张 +6%、5 张 +15%；五行俱全 +12%；相邻相生（木→火→土→金→水→木）+8%；同族 3 张 +5%、5 张 +10%；主题羁绊另计。队伍第一张是队长，只有队长的队长技会生效，对全队有效。只有 SR 以上的卡有队长技。</p>\n<h4>羁绊</h4><p>同族 3 人 +5%，同族 5 人 +10%。历史羁绊：桃园 3 人 +10%、五虎 5 人 +20%、取经 4 人 +12%、四海龙王、八仙、七福神、四大天王、四凶、四象、梁山等。</p>\n<h4>装备与战场</h4><p>每位角色可各装备 1 件神兵、宝物、名马。装备会把本身 ATK／DEF 的 30% 加给角色（装 2～3 件时各 20%）。宝物、神兵、名马没有五行。团体战可放 1 张战场卡，效果对双方都有效。</p>\n<h4>对战</h4><ul><li>每日首领战：每天 1 位强力首领，最多编入 50 张卡，每天 3 次。HP 保留到击败为止，击败奖励 10 包。</li><li>单人随机对战：选 1 张卡，挑战指定级别的随机对手。</li><li>团体战：5 张卡按出战顺序一对一，先取得 3 胜即结束（最多 5 战）。</li><li>剧情远征：赢得知识，强化 5 张卡，每 5 关提升一个级别。</li></ul>\n<h4>{CHANGELOG}</h4><ul><li>2026/11/22 v3：正式上线（mylegends.org）；没有内建图片的人物卡改为即时载入维基百科图片，并加上水墨印章底图；加入台北故宫 28,698 件宝物；出处表更新；人物依地区加权；全服累计开包改为真实数据（从 0 开始）；规则说明支援八种语言。</li><li>2026/11/21 v2：卡包改为撕开式；SSR／UR／EXR 专属出卡特效；新卡面；本机备份汇出与合并汇入；八种语言；博物馆宝物卡；每日首领战、团体战、剧情远征；奖杯。</li><li>2026/11/21 v1：第一版原型。</li></ul>\n<h4>授权与出处</h4><p>卡片文字摘自维基百科，依 <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--gold)\">CC BY-SA 4.0</a> 授权使用并同样以 CC BY-SA 4.0 分享。图片与宝物资料来源：</p>{SRCTABLE}<p>人物图片来自维基共享资源，每张卡的详情都标示档案名称与连结。即将加入：日本 ColBase（国立文化财机构）、Japan Search、国立国会图书馆。本游戏为非官方作品，与维基百科及各博物馆无关。</p>\n<h4>资料</h4><p>资料快照：2026/11/21。游戏进度只存在你的浏览器里，请到图鉴页定期汇出备份。</p>", "anat_h": "卡片解读", "anat": ["名字（版本卡是「人物・版本名」）", "种族图示（人、仙、妖、鬼、龙、神、魔）", "五行符号：木、火、土、金、水。神魔和宝物没有五行", "图片：公有领域的画像或博物馆文物", "类型行：传奇（SSR 以上）· 种类 — 主题", "稀有度符号：颜色代表稀有度，C 黑、UC 银、R 金、SR 蓝、SSR 橙红、UR 珍珠彩、EXR 彩虹", "队长技（只有 SR 以上才有，队长＝队伍第一张）", "介绍：维基百科或博物馆的说明", "ATK 攻击／DEF 防御", "稀有度、编号、图片来源（credit）", "连结：点开看维基百科条目或博物馆页面"], "anat_p": "外框颜色就是五行：绿＝木、红＝火、黄＝土、白＝金、蓝＝水。金色多色框是神族，黑曜石框是魔族，银色是没有五行的宝物、神兵、名马。", "src": ["维基百科／维基共享资源", "国立故宫博物院（台北故宫）", "克里夫兰美术馆", "大都会艺术博物馆", "CC BY-SA 4.0／公有领域"]}};

function srcRows(RL){
  const nm=RL.src;const S2=[['國立故宮博物院',nm[1],'https://digitalarchive.npm.gov.tw/','CC BY 4.0'],['Cleveland Museum of Art',nm[2],'https://www.clevelandart.org/open-access','CC0'],['The Metropolitan Museum of Art',nm[3],'https://www.metmuseum.org/about-the-met/policies-and-documents/open-access','CC0']];
  const n={};let wk=0;for(const c of CARDS){if(c.wk)wk++;else{const k=(c.c||'').split('·')[0].trim();n[k]=(n[k]||0)+1}}
  const row=(name,url,lic,cnt)=>`<tr><td><a href="${url}" target="_blank" rel="noopener" style="color:var(--gold)">${name}</a></td><td>${lic}</td><td>${cnt?cnt.toLocaleString():'…'}</td></tr>`;
  return row(nm[0],'https://commons.wikimedia.org/',nm[4],wk)+S2.filter(x=>n[x[0]]||!CARDS.length).map(x=>row(x[1],x[2],x[3],n[x[0]])).join('');
}
function showRules(){
  if(!CARDS.length&&window.DATAP)DATAP.then(()=>{const o=document.querySelector('.box.rules');if(o){o.closest('.ov').remove();showRules()}});
  const counts=RAR.map(r=>[r,(BYRAR[r]||[]).length]);
  const host=document.createElement('div');host.className='ov';host.style.zIndex=40;
  const RL=RULES_I18N[L]||RULES_I18N.en;
  const rar=`<table><tr>${RL.th_rar.map(h=>`<th>${h}</th>`).join('')}</tr>${counts.map(([r,n])=>`<tr><td><b class="rb r-${r}">${r}</b></td><td>${RATE[r]<1?RATE[r].toFixed(3):RATE[r]}%</td><td>${n?n.toLocaleString():'…'}</td></tr>`).join('')}</table>`;
  const src=`<table><tr>${RL.th_src.map(h=>`<th>${h}</th>`).join('')}</tr>${srcRows(RL)}</table>`;
  const body=RL.body.replace('{RARTABLE}',rar).replace('{SRCTABLE}',src).replace('{ANAT}',anatomyHTML(RL)).replace('{CHANGELOG}',T('changelog')).replace('{BH}',BANNER.hours).replace('{BB}',BANNER.boost).replace('{BG}',BANNER.guardH).replace('{BS}',BANNER.spark);
  host.innerHTML=`<div class="box rules" style="max-width:820px"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">${T('rules')}</h2><button class="btn ghost" data-x>${T('close')}</button></div>
  ${body}
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn ghost" id="replay">${T('replay_intro')}</button><button class="btn ghost" id="reset">${T('reset')}</button></div></div>`;
  document.body.appendChild(host);host.onclick=e=>{if(e.target===host||e.target.closest('[data-x]'))host.remove()};
  $('#replay',host).onclick=()=>{host.remove();intro(true)};
  $('#reset',host).onclick=e=>{const b=e.target;if(b.dataset.c){const lang=S.lang;S=FRESH();S.lang=lang;S.introSeen=true;save();host.remove();render()}else{b.dataset.c=1;b.textContent=T('reset_confirm')}};
}

/* ================= intro ================= */
function intro(force){
  if(!force&&S.introSeen)return;
  const el=$('#intro');el.hidden=false;$('#introLine').textContent=T('intro_line');$('#introSkip').textContent=T('skip')+' »';$('#introTag').textContent=L==='en'?T('tag'):T('game');$('#introKv').style.backgroundImage=`url(hero/${innerHeight>innerWidth?'hero6':'hero5'}.webp)`;
  const cv=$('#introCv'),ctx=cv.getContext('2d');let W,H,raf;const dpr=Math.min(2,devicePixelRatio||1);
  const rs=()=>{W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr};rs();
  const glyphs='符敕令神魔妖鬼仙龍雷火風山海';
  const P=Array.from({length:28},()=>({x:Math.random(),y:Math.random(),z:.3+Math.random()*1.2,r:Math.random()*6.28,vr:(Math.random()-.5)*.01,vy:.0006+Math.random()*.0012,g:glyphs[Math.floor(Math.random()*glyphs.length)],warm:Math.random()<.5}));
  const stars=Array.from({length:140},()=>({x:Math.random(),y:Math.random(),a:Math.random()}));
  const draw=()=>{ctx.clearRect(0,0,W,H);
    for(const s of stars){ctx.fillStyle=`rgba(245,217,149,${.15+.4*Math.abs(Math.sin(Date.now()/900+s.a*9))})`;ctx.fillRect(s.x*W,s.y*H,1.5*dpr,1.5*dpr)}
    for(const p of P){p.y-=p.vy*p.z;p.r+=p.vr;if(p.y<-.1){p.y=1.1;p.x=Math.random()}
      const w=26*p.z*dpr,h=64*p.z*dpr;ctx.save();ctx.translate(p.x*W,p.y*H);ctx.rotate(p.r);ctx.globalAlpha=(.25+.35*p.z/1.5)*.55;
      ctx.fillStyle=p.warm?'#e9d3a3':'#d9c9b6';ctx.fillRect(-w/2,-h/2,w,h);ctx.strokeStyle='#8a2a1a';ctx.lineWidth=1*dpr;ctx.strokeRect(-w/2+2*dpr,-h/2+2*dpr,w-4*dpr,h-4*dpr);
      ctx.fillStyle='#8a2a1a';ctx.font=`${14*p.z*dpr}px "LXGW WenKai TC",serif`;ctx.textAlign='center';ctx.fillText(p.g,0,4*dpr);ctx.restore()}
    raf=requestAnimationFrame(draw)};draw();
  const end=()=>{if(el.hidden)return;cancelAnimationFrame(raf);el.hidden=true;S.introSeen=true;save();removeEventListener('resize',rs);setTimeout(()=>{if(window.__ready)maybeNotice();else window.__noticeWait=1},200)};
  addEventListener('resize',rs);$('#introSkip').onclick=end;setTimeout(()=>{if(!el.hidden)end()},6500);
}

/* ================= boot ================= */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#lang').onchange=e=>{L=S.lang=e.target.value;save();chrome();render();cloudBtn()};
$('#btnTrophy').onclick=showTrophies;$('#btnCloud').onclick=openCloud;cloudBtn();$('#btnRules').onclick=showRules;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.ov').forEach(o=>o.remove());$('#layer').innerHTML=''}});
chrome();intro(false);
(window.DATAP=loadData()).then(()=>{if(S.cloud)cloudSync().then(()=>render()).catch(()=>{});if(S.banner.id!==BANNER.id){S.banner={id:BANNER.id,pulled:0,got:false,start:Date.now()};save()}go('pull');window.__ready=1;if($('#intro').hidden)setTimeout(maybeNotice,300)}).catch(e=>{$('#app').innerHTML='<p>Failed to load cards.json</p>'});
</script>
