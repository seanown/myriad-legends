<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>萬象傳奇錄</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Cinzel+Decorative:wght@900&family=Zhi+Mang+Xing&family=Noto+Serif+TC:wght@400;700;900&display=swap">
<style>
/* Layout: wikigacha-style app shell (top bar, three tabs, centered column) dressed as a night shrine: ink black, cinnabar seals, gold leaf. Deliberately one dark look. */
:root{
  color-scheme:dark;
  --bg:#0b0a0d; --bg2:#121016; --panel:#17141b; --panel2:#1f1a24; --line:#2c2532; --line2:#3b3242;
  --ink:#efe6d6; --muted:#9a8f9e; --gold:#e3b866; --gold2:#f5d995; --cin:#c8402c; --jade:#5fb39a;
  --rC:#cfc4ae; --rUC:#c9d4e6; --rR:#5fd18f; --rSR:#5aa7ff; --rSSR:#ff6b6b; --rUR:#ffd24a; --rEXR:#c58cff;
  --race-人:#6fbf73; --race-仙:#5aa7ff; --race-妖:#ff7a45; --race-鬼:#d9d2b8; --race-龍:#c9974f; --race-神:#e6c25e; --race-魔:#c0395f;
  --f-disp:"LXGW WenKai TC","BiauKai","DFKai-SB","STKaiti","KaiTi",serif; --f-body:"Noto Serif TC","Noto Serif SC","Songti TC","PMingLiU",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:rgba(11,10,13,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.topin{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lang{justify-self:start;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700}
.tabs{display:flex;gap:18px}
.tabs button{background:none;border:0;font-size:19px;font-weight:900;color:var(--muted);padding:4px 2px;border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--gold);border-bottom-color:var(--gold)}
.rt{justify-self:end;display:flex;gap:8px}
.icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;font-size:17px}
@media (max-width:520px){.tabs{gap:10px}.tabs button{font-size:16px}.lang{font-size:12px;padding:4px 8px}.icon{width:32px;height:32px}}
main{max-width:1100px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%}
.btn{background:linear-gradient(#e9c16f,#b8862f);color:#231504;border:1px solid #ffe4a6;border-radius:10px;padding:9px 16px;font-weight:900}
.btn.ghost{background:var(--panel2);color:var(--ink);border-color:var(--line2);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:4px 10px;font-size:13px}
.chip[aria-pressed=true]{background:var(--gold);color:#231504;border-color:var(--gold2);font-weight:900}
h2{font-size:24px;margin:6px 0 14px}
.muted{color:var(--muted)}
.r-C{color:var(--rC)}.r-UC{color:var(--rUC)}.r-R{color:var(--rR)}.r-SR{color:var(--rSR)}.r-SSR{color:var(--rSSR)}.r-UR{color:var(--rUR)}.r-EXR{color:var(--rEXR)}
.rb{font-weight:900;font-family:Georgia,serif;letter-spacing:.02em}

/* pull page */
.counter{border:2px solid var(--gold);border-radius:999px;padding:8px 26px;font-weight:900;color:var(--gold);font-size:18px;box-shadow:0 0 18px #e3b86655;font-variant-numeric:tabular-nums;letter-spacing:.08em}
.counter b{color:var(--ink);font-family:ui-monospace,Menlo,monospace}
.sub{font-size:13px;color:var(--muted);text-align:center;line-height:1.6}
.sub .g{color:var(--gold);font-weight:700}
.tapline{font-weight:900;color:var(--muted);font-size:17px}
.banner{width:100%;border-radius:14px;border:1px solid #6b3a2c;background:linear-gradient(120deg,#2a1210,#1a0f18);padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.banner .bimg{width:64px;height:84px;border-radius:8px;background:#000 center/cover;border:2px solid var(--rEXR)}
.bar{height:7px;background:#0006;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cin),var(--gold))}
.missions li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}
.missions .ok{color:#4ade80;font-weight:700}
.live{font-size:13px;color:var(--muted);text-align:center}
.live b{color:var(--gold2);font-variant-numeric:tabular-nums;font-size:16px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}

/* reveal overlay */
.ov{position:fixed;inset:0;z-index:30;background:rgba(5,4,7,.94);overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.stage{position:relative;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:80vh;justify-content:center}
.burst{position:absolute;left:50%;top:42%;width:900px;height:900px;transform:translate(-50%,-50%);pointer-events:none;opacity:.9;
  background:repeating-conic-gradient(from 0deg,var(--rc) 0 4deg,transparent 4deg 14deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);animation:spin 18s linear infinite}
.burst.soft{opacity:.25}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.circle{position:absolute;left:50%;top:42%;width:340px;height:340px;transform:translate(-50%,-50%);pointer-events:none;opacity:.55;animation:spin 30s linear infinite reverse}
.bigr{font-family:Georgia,serif;font-weight:900;font-size:64px;line-height:1;color:var(--rc);text-shadow:0 0 24px var(--rc),0 4px 0 #000;z-index:2;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.tcard{--rc:var(--rC);position:relative;z-index:2;width:min(300px,78vw);border-radius:14px;padding:3px;background:var(--rc);box-shadow:0 0 30px var(--rc);animation:rise .6s ease-out;overflow:hidden}
.tcard.r-UR,.tcard.r-EXR{background:linear-gradient(130deg,var(--rc),#fff6,var(--rc))}
@keyframes rise{from{transform:translateY(40px) scale(.9);opacity:0}}
.tcard .in{background:linear-gradient(#1c1720,#0d0b10);border-radius:11px;overflow:hidden}
.tcard .art{aspect-ratio:4/3;background:#07060a center/cover no-repeat;position:relative;display:grid;place-items:center}
.tcard .art .gl{font-family:var(--f-disp);font-size:88px;color:var(--ink);text-shadow:0 0 22px var(--rc)}
.tcard .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff55 50%,transparent 65%);transform:translateX(-120%);animation:shine 2.4s 0.5s ease-in-out infinite;pointer-events:none}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.tcard .meta{padding:10px 12px 12px}
.tcard .tt{font-size:20px;font-weight:900;line-height:1.2}
.tcard .idl{font-size:11px;color:var(--muted)}
.tcard .ds{font-size:12.5px;color:#cfc5d4;margin:6px 0;max-height:4.6em;overflow:hidden}
.tcard .ad{display:flex;justify-content:space-between;font-family:Georgia,serif;font-weight:900;font-size:15px;border-top:1px solid #ffffff1a;padding-top:6px}
.tcard .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;border:1px solid #6b5420;color:var(--gold);background:#2a210e;border-radius:999px;padding:0 8px}
.race{font-size:11px;font-weight:900;border-radius:999px;padding:0 8px;color:#120e08;background:var(--rcol)}
.lineup{display:flex;gap:6px;z-index:2}
.lineup span{width:44px;height:58px;border-radius:6px;border:2px solid var(--rc);background:#000 center/cover;opacity:.35}
.lineup span.on{opacity:1}
.lineup span.cur{outline:2px solid #fff;outline-offset:1px}
.newb{position:absolute;top:8px;left:8px;background:var(--cin);color:#fff;font-weight:900;font-size:11px;padding:1px 8px;border-radius:999px;z-index:3}
.packopen{position:relative;width:240px;height:400px}
.packopen .half{position:absolute;inset:0;transition:transform .7s ease-in,opacity .7s}
.summon-seal{position:absolute;left:50%;top:50%;width:300px;height:300px;transform:translate(-50%,-50%);opacity:0;animation:seal 1.4s ease-out forwards}
@keyframes seal{30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6) rotate(90deg)}}

/* codex */
.subtabs{display:flex;gap:8px;margin-bottom:14px}
.subtabs button{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 16px;font-weight:700}
.subtabs button[aria-selected=true]{border-color:var(--gold);color:var(--gold);background:#2a210e}
.stathead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.stathead h3{margin:0;font-size:20px}
.tiers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) 10px repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
@media (max-width:700px){.tiers{grid-template-columns:repeat(4,minmax(0,1fr))}.tiers .sep{display:none}}
.tier{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11px;font-variant-numeric:tabular-nums;min-width:0}
.tier .h{display:flex;justify-content:space-between;gap:4px}
.tier .p{text-align:right;color:var(--muted)}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.inp{width:100%;background:#000;border:1px solid var(--line2);border-radius:8px;padding:9px 12px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:14px}
table.cards{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
table.cards th{background:#000;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.05em;padding:10px 8px;text-align:left}
table.cards td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:middle}
table.cards tr{cursor:pointer}
table.cards tr:hover td{background:#ffffff06}
table.cards .num{text-align:right;font-variant-numeric:tabular-nums}
.thumb{width:40px;height:52px;border-radius:5px;background:#000 center/cover;border:1px solid var(--line2);flex:none;display:grid;place-items:center;font-family:var(--f-disp);color:var(--muted)}
.tcell{display:flex;gap:10px;align-items:center;min-width:0}
.star{background:none;border:0;font-size:18px;color:var(--muted)}
.star.on{color:var(--gold)}
.idc{font-size:11px;color:#6e6474}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:8px}
.pager input{width:70px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.theme{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.mini{position:relative;border-radius:8px;padding:2px;background:var(--rc);cursor:pointer;min-width:0}
.mini .im{aspect-ratio:3/4;border-radius:6px;background:#0a090c center/cover;display:grid;place-items:center;font-family:var(--f-disp);font-size:30px;color:var(--ink)}
.mini .nm{position:absolute;left:2px;right:2px;bottom:2px;background:linear-gradient(transparent,#000d 40%);border-radius:0 0 6px 6px;padding:10px 4px 3px;font-size:11px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .rr{position:absolute;top:4px;right:5px;font-family:Georgia,serif;font-weight:900;font-size:11px;color:var(--rc);text-shadow:0 1px 2px #000}
.mini.lock{background:var(--line)}
.mini.lock .im{filter:brightness(.15) grayscale(1)}
.mini.sel{outline:3px solid var(--gold);outline-offset:1px}

/* detail */
.det{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:start;width:100%;max-width:860px;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:16px;position:relative}
@media (max-width:680px){.det{grid-template-columns:1fr}.det .tcard{margin:0 auto}}
.det h3{margin:0;font-size:26px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:10px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.statbig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.statbig div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.statbig small{display:block;font-size:11px;color:var(--muted)}
.statbig b{font-family:Georgia,serif;font-size:20px;font-variant-numeric:tabular-nums}
.x{position:absolute;top:10px;right:10px}

/* battle */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.modes{grid-template-columns:1fr}}
.mode{border-radius:14px;padding:16px 18px;text-align:left;border:1px solid;min-height:110px;position:relative}
.mode h3{margin:0 0 6px;font-size:20px}
.mode p{margin:0;font-size:14px;color:#d8cfdc}
.m-boss{background:linear-gradient(135deg,#3a1219,#1b0d14);border-color:#8a2a3a}.m-boss h3{color:#ff8a9a}
.m-solo{background:linear-gradient(135deg,#132447,#0d1426);border-color:#2f5ba8}.m-solo h3{color:#9cc3ff}
.m-team{background:linear-gradient(135deg,#0f3238,#0a191d);border-color:#1f7480}.m-team h3{color:#7fe3ee}
.m-story{background:linear-gradient(135deg,#3a2c0c,#1a1408);border-color:#8a6a1e}.m-story h3{color:var(--gold2)}
.newtag{position:absolute;top:12px;right:12px;font-size:11px;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:1px 8px}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.statgrid div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.statgrid small{color:var(--muted);font-size:12px}
.statgrid b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
table.lv{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.lv th,table.lv td{padding:7px 8px;border-top:1px solid var(--line);text-align:right}
table.lv th:first-child,table.lv td:first-child{text-align:left}
.rec{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:6px}
.arena{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.fighter{text-align:center;min-width:0}
.fighter .mini{max-width:140px;margin:0 auto}
.hp{height:10px;background:#0008;border-radius:5px;overflow:hidden;margin-top:6px;border:1px solid #000}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#a3e635);transition:width .25s}
.blog{background:#000;border:1px solid var(--line);border-radius:10px;height:180px;overflow-y:auto;padding:8px 10px;font-size:13px;margin-top:12px}
.blog p{margin:0 0 2px}
.adv{color:#ff9a6a}.dis{color:#8fb0ff}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.slot{border:2px dashed var(--line2);border-radius:10px;min-height:120px;display:flex;flex-direction:column;gap:4px;padding:4px;min-width:0}
.slot.sel{border-color:var(--gold)}
.slot .eq{font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:2px 4px;background:var(--panel2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.picker{max-height:420px;overflow-y:auto;margin-top:10px;padding:2px}

/* trophies & rules */
.troph{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.troph div{position:relative;display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--muted);opacity:.55}
.troph div.on{opacity:1;border-color:#8a6a22;background:linear-gradient(180deg,#2a1f0c,#120d06);color:var(--ink)}
.troph .tic{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;border:1px solid var(--line);background:#0006;filter:grayscale(1)}
.troph div.on .tic{filter:none;border-color:#c99a2e}
.troph b{display:block;font-size:15px;margin-bottom:2px}
.troph div.on b{color:var(--gold)}
.troph em{position:absolute;top:8px;right:10px;font-style:normal;font-size:10px;color:var(--gold);border:1px solid #8a6a22;border-radius:4px;padding:1px 5px;background:#0008}
.rules h4{color:var(--gold);margin:16px 0 4px}
.rules p,.rules li{font-size:14px;color:#d8cfdc;max-width:70ch}
.rules table{border-collapse:collapse;font-size:13px}
.rules td,.rules th{border:1px solid var(--line2);padding:4px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cin);color:#fff;border-radius:10px;padding:8px 16px;font-weight:700;z-index:50;max-width:90vw}

/* intro */
#intro[hidden]{display:none!important}
#intro{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at 50% 30%,#1d1222,#060508 70%);overflow:hidden;display:flex;align-items:center;justify-content:center}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro .beam{position:absolute;left:30%;top:-20%;width:180px;height:160%;background:linear-gradient(90deg,transparent,#f5d99522,#fff3,#f5d99522,transparent);transform:rotate(18deg);filter:blur(6px)}
#intro .t{position:relative;text-align:center;z-index:2}
#intro .t small{display:block;letter-spacing:.5em;font-size:12px;color:var(--gold);margin-bottom:24px}
#intro .t h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(34px,7vw,64px);margin:0;color:var(--ink);text-shadow:0 0 30px #e3b86688;opacity:0;animation:fadein 2s .8s forwards}
#intro .t .rule{width:220px;height:1px;margin:22px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
@keyframes fadein{to{opacity:1}}
#intro .skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:3;border:1px solid var(--gold);background:#0008;color:var(--ink);border-radius:999px;padding:8px 18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* torn card pack */
.pack{position:relative;width:min(240px,62vw);aspect-ratio:240/400;cursor:pointer;margin:6px 0;transition:transform .2s;filter:drop-shadow(0 18px 30px #000);--glow:var(--gold)}
.pack:hover{transform:translateY(-4px) rotate(-1deg)}
.pack svg{width:100%;height:100%;display:block}
.pack .ptop,.pack .pbody{position:absolute;inset:0}
.pack .ptop{clip-path:polygon(0 0,100% 0,100% 14.5%,0 14.5%)}
.pack .pbody{clip-path:polygon(0 14.5%,100% 14.5%,100% 100%,0 100%)}
.pack .pglow{position:absolute;left:4%;right:4%;top:13%;height:6px;border-radius:50%;background:var(--glow);box-shadow:0 0 30px 14px var(--glow);opacity:0;pointer-events:none}
.pack.tearing{animation:packshake .35s}
.pack.tearing .ptop{animation:tearoff .7s .3s cubic-bezier(.4,0,.6,1) forwards}
.pack.tearing .pglow{animation:glowup .8s .45s ease-out forwards}
.pack.tearing .pbody{animation:dropbody .6s .75s ease-in forwards}
.pack.hot.tearing{animation:packshake .35s 3}
.pack.hot.tearing .ptop{animation-delay:.9s}.pack.hot.tearing .pglow{animation-delay:.9s;animation-duration:1.2s}.pack.hot.tearing .pbody{animation-delay:1.2s}
@keyframes tearoff{0%{transform:none}30%{transform:translate(8px,-4px) rotate(3deg)}100%{transform:translate(160px,-120px) rotate(38deg);opacity:0}}

','武術':'Martial Arts','怨靈':'Onryō','三種神器':'Imperial Regalia','器皿':'Vessels','秦':'Qin','南北朝':'Northern & Southern','楊家將':'Yang Generals','戰國七雄':'Seven Warring States','元寇':'Mongol Invasions','木版':'Woodblock','說岳':'Yue Fei Saga','忠臣藏':'Chūshingura','財神':'Wealth Gods','十殿':'Ten Courts','限定':'Limited','東晉':'Eastern Jin','文學':'Literature','孫悟空':'Sun Wukong','刺繡':'Embroidery','Glyptic':'Glyptic'};

function wBatch(l,items){
  const titles=[...new Set(items.map(x=>x.t))];
  const url=`https://${l}.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&redirects=1&prop=pageimages&piprop=thumbnail|name&pithumbsize=480&titles=${encodeURIComponent(titles.join('|'))}`;

    const map={};const q=j.query||{};

    const fw={};for(const a of [...(q.normalized||[]),...(q.redirects||[])])fw[a.from]=a.to;

function refill(){
  const now=Date.now();
  if(S.packs>=PACK_MAX){S.lastRefill=now;return}
  const n=Math.floor((now-S.lastRefill)/REFILL_MS);
  if(n>0){S.packs=Math.min(PACK_MAX,S.packs+n);S.lastRefill+=n*REFILL_MS;if(S.packs>=PACK_MAX)S.lastRefill=now;save()}
}
function daily(){
  const d=today();
  if(S.lastLogin!==d){S.lastLogin=d;S.stamps++;if(S.stamps%5===0)S.pendingBlack++;save()}
  if(S.mission.date!==d){S.mission={date:d,open:0,sr:false,wiki:false,share:false,show:false,claimed:{}};save()}
  if(S.boss.date!==d){S.boss.date=d;S.boss.tries=3;if(S.boss.dmg>=bossHP())S.boss.dmg=0;save()}

function packType(){
  if(S.pendingBlack>0)return 'black';

  if(S.pendingRainbow>0)return 'rainbow';

  return 'white';
}
function rollRarity(min){
  let r=Math.random()*100,acc=0,out='C';
  for(const k of ['EXR','UR','SSR','SR','R','UC','C']){acc+=RATE[k];if(r<acc){out=k;break}}
  if(min&&RAR.indexOf(out)<RAR.indexOf(min)){ // re-roll among tiers >= min with relative weights
    const tiers=RAR.slice(RAR.indexOf(min));const tot=tiers.reduce((a,k)=>a+RATE[k],0);let x=Math.random()*tot;
    for(const k of tiers.slice().reverse()){x-=RATE[k];if(x<=0){out=k;break}}
  }
  return out;
}

function bannerActive(){return true}
const fmtHM=ms=>{ms=Math.max(0,ms);return `${Math.floor(ms/3600e3)}h ${String(Math.floor(ms%3600e3/60e3)).padStart(2,'0')}m`};
const KIND_W=[['char',.6],['item',.3],['field',.1]];
const KIND_OF=k=>k==='char'?'char':(k==='treasure'||k==='weapon')?'item':'field';
function pickCard(rar){
  const all=(BYRAR[rar]||[]).filter(c=>c.k!=='event');if(!all.length)return pickCard(RAR[Math.max(0,RAR.indexOf(rar)-1)]);
  let x=Math.random(),want='char';for(const[k,w]of KIND_W){if(x<w){want=k;break}x-=w}
  let pool=all.filter(c=>KIND_OF(c.k)===want);if(!pool.length)pool=all;
  if(bannerActive()){const th=pool.filter(c=>(c.t||[]).includes(BANNER.theme)); // Sean 22:37: theme cards ×30 weight
    if(th.length){const w=BANNER.boost*th.length;if(Math.random()*(w+pool.length-th.length)<w)return th[Math.floor(Math.random()*th.length)]}}
  if(want==='char'){ // Sean 2026-11-21: country weights so minor Japanese C figures don't flood packs
    const b=CBUCKET[rar]||(CBUCKET[rar]=bucketize(pool));const ks=Object.keys(COUNTRY_W).filter(k=>b[k]&&b[k].length);
    let tot=ks.reduce((a,k)=>a+COUNTRY_W[k],0),y=Math.random()*tot;for(const k of ks){if(y<COUNTRY_W[k])return b[k][Math.floor(Math.random()*b[k].length)];y-=COUNTRY_W[k]}}
  return pool[Math.floor(Math.random()*pool.length)];
}
const COUNTRY_W={中國:55,日本:20,朝鮮:10,其他:15},CBUCKET={};
function countryOf(c){const t=c.t||[];if(t.includes('中國')||t.includes('三國'))return '中國';if(t.includes('日本')||t.includes('戰國日本'))return '日本';if(t.includes('朝鮮')||t.includes('韓國'))return '朝鮮';return '其他'}
function bucketize(pool){const b={};for(const c of pool)(b[countryOf(c)]=b[countryOf(c)]||[]).push(c);return b}
// every 8h of the 48h banner: first card of the next pack = theme card SSR or better
const guardReady=()=>bannerActive()&&Date.now()>=(S.banner.nextG||0);
function pickGuard(){const tiers=RAR.slice(RAR.indexOf(BANNER.guardMin));
  const th=CARDS.filter(c=>c.k!=='event'&&tiers.includes(c.y)&&(c.t||[]).includes(BANNER.theme));if(!th.length)return null;
  const rar=rollRarity(BANNER.guardMin);const L=th.filter(c=>c.y===rar);const P=L.length?L:th;return P[Math.floor(Math.random()*P.length)]}
function openPack(){
  refill();if(S.packs<=0){toast(T('no_packs'));return null}
  const type=packType();S.packs--;if(S.packs===PACK_MAX-1)S.lastRefill=Date.now();
  if(type==='black')S.pendingBlack--;
  else if(type==='rainbow'){if(S.firstPackDay!==today())S.firstPackDay=today();else S.pendingRainbow--}
  if(type==='gold')S.white=0;else if(type==='white')S.white++;
  S.rbCount++;if(S.rbCount%100===0)S.pendingRainbow++;
  const guard={black:'UR',rainbow:'SSR',gold:'SR'}[type];
  const res=[];
  for(let i=0;i<PACK_N;i++){
    let rar=rollRarity(i===PACK_N-1&&guard?guard:null);
    let c=pickCard(rar);
    if(i===0&&guardReady()){const g=pickGuard();if(g){c=g;S.banner.nextG=Date.now()+BANNER.guardH*3600e3}}
    S.banner.pulled++;
    if(!S.banner.got&&S.banner.pulled>=BANNER.spark){const ex=CARDS.find(x=>x.k==='event')||CARDS.find(x=>nm(x)===BANNER.exclusive);if(ex){c=ex;S.banner.got=true}}
    const isNew=!S.owned[c.i];S.owned[c.i]=(S.owned[c.i]||0)+1;if(isNew)S.order[c.i]=S.pulls+i;
    res.push({c,isNew});
  }
  S.pulls+=PACK_N;S.packsOpened++;S.mission.open++;liveAdd(1);
  if(S.packsOpened-(S.lastBackup||0)>=50&&S.packsOpened%50===0)setTimeout(()=>toast(T('bk_remind')),2500);
  if(res.some(x=>RAR.indexOf(x.c.y)>=3))S.mission.sr=true;
  packTrophies(res.map(x=>x.c));
  save();return {type,res};
}

function liveFlush(beacon){const k=LIVE.pending;if(!k)return;LIVE.pending=0;clearTimeout(LIVE.t);LIVE.t=null;const body=JSON.stringify({n:k});

/* per-rarity entrance: SSR = 金光破符, UR = 七彩法陣, EXR = 黑雷天印 */
function fx(kind,box){
  const cv=document.createElement('canvas');cv.className='fxc';box.appendChild(cv);
  const W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;const g=cv.getContext('2d');
  const cols={SR:['#ffd24a','#ff8a1a','#fff1b8','#ff5a14'],SSR:['#ffd24a','#ff6b6b','#fff1b8','#ff8a00'],UR:['#ff7ab6','#ffd24a','#6ee7b7','#7cc4ff','#b9a3ff'],EXR:['#c58cff','#ff3b3b','#ffffff','#ffd24a']}[kind];
  const N=kind==='EXR'?320:kind==='UR'?240:kind==='SSR'?200:90;const ps=[];
  for(let i=0;i<N;i++){const a=Math.random()*Math.PI*2,v=(2+Math.random()*9)*devicePixelRatio;ps.push({x:W/2,y:H*.42,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(kind==='UR'?3:0),r:(1+Math.random()*3.5)*devicePixelRatio,c:cols[i%cols.length],l:1})}
  let t=0;const step=()=>{t++;g.clearRect(0,0,W,H);
    for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vx*=.975;p.vy=p.vy*.975+(kind==='EXR'?.02:.06)*devicePixelRatio;p.l-=.008;if(p.l<=0)continue;g.globalAlpha=p.l;g.fillStyle=p.c;g.beginPath();
      if(kind==='SSR'){g.ellipse(p.x,p.y,p.r,p.r*3,Math.atan2(p.vy,p.vx)+Math.PI/2,0,7)}else g.arc(p.x,p.y,p.r,0,7);g.fill()}
    if(kind==='EXR'&&t%38<3){g.globalAlpha=.8;g.strokeStyle=t%76<3?'#ff3b3b':'#c58cff';g.lineWidth=3*devicePixelRatio;g.beginPath();let x=Math.random()*W,y=0;g.moveTo(x,y);while(y<H*.5){x+=(Math.random()-.5)*80*devicePixelRatio;y+=40*devicePixelRatio;g.lineTo(x,y)}g.stroke()}
    if(t<240&&cv.isConnected)requestAnimationFrame(step);else cv.remove()};
  requestAnimationFrame(step);
}

function cardBackSVG(){
  const P5=['#6fbf73','#ff6a3d','#d9a441','#e9e4d4','#2e333d']; // 人→妖→龍→鬼→仙 (相生 ring; inner star = 相剋)
  const gem=(x,y,c,r)=>`<circle cx="${x}" cy="${y+1.5}" r="${r}" fill="#000" opacity=".5"/><circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${x}" cy="${y}" r="${r}" fill="url(#cbgl)"/><ellipse cx="${x-r*.32}" cy="${y-r*.38}" rx="${r*.38}" ry="${r*.24}" fill="#fff" opacity=".75"/>`;
  const cx=150,cy=262,R=50;const pts=P5.map((c,i)=>{const a=(-90+i*72)*Math.PI/180;return [cx+R*Math.cos(a),cy+R*Math.sin(a),c]});
  const stars=Array.from({length:80},(_,i)=>`<circle cx="${(i*73)%290+5}" cy="${(i*131)%410+5}" r="${(i%3)*.5+.4}" fill="#fff" opacity="${.25+(i%5)/10}"/>`).join('');
  return `<svg viewBox="0 0 300 420" aria-hidden="true" style="position:static;width:100%;height:100%;display:block"><defs>
   <radialGradient id="cbgl" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>
   <linearGradient id="cbgold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1c1"/><stop offset=".45" stop-color="#e2b04a"/><stop offset=".55" stop-color="#a8761f"/><stop offset="1" stop-color="#f3d27a"/></linearGradient>
   <radialGradient id="cbsky" cx=".5" cy=".45" r=".75"><stop offset="0" stop-color="#1b1233"/><stop offset="1" stop-color="#07050d"/></radialGradient></defs>
   <rect width="300" height="420" rx="16" fill="#0b0712"/>${stars}
   <rect x="10" y="10" width="280" height="400" rx="10" fill="none" stroke="url(#cbgold)" stroke-width="4"/>
   <ellipse cx="150" cy="212" rx="118" ry="176" fill="url(#cbsky)" stroke="url(#cbgold)" stroke-width="4"/>
   <ellipse cx="150" cy="212" rx="109" ry="167" fill="none" stroke="#e2b04a" stroke-opacity=".35"/>
   ${stars.replace(/opacity="/g,'opacity="0.').slice(0,0)}
   <text x="150" y="122" text-anchor="middle" font-family="Cinzel Decorative,Georgia,serif" font-weight="900" font-size="31" fill="url(#cbgold)" stroke="#2a1606" stroke-width="1.2" paint-order="stroke">MYRIAD</text>
   <text x="150" y="152" text-anchor="middle" font-family="Cinzel Decorative,Georgia,serif" font-weight="900" font-size="31" fill="url(#cbgold)" stroke="#2a1606" stroke-width="1.2" paint-order="stroke">LEGENDS</text>
   <polygon points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="#e2b04a" stroke-opacity=".5" stroke-width="1.3"/>
   <polyline points="${[0,2,4,1,3,0].map(i=>pts[i][0]+','+pts[i][1]).join(' ')}" fill="none" stroke="#e2b04a" stroke-opacity=".28" stroke-width="1"/>
   ${pts.map(p=>gem(p[0],p[1],p[2],12)).join('')}
   ${[[24,24],[276,24],[24,396],[276,396]].map(([x,y])=>gem(x,y,'#e2b04a',4)).join('')}</svg>`;
}

  const k=c.y,rb=k==='EXR';
  const host=document.createElement('div');host.className='spot spot-'+k;host.style.setProperty('--rc',`var(--r${k})`);
  host.innerHTML=`<div class="sp-rays ${rb?'rainbow':''}"></div><div class="sp-in">
    <div class="sp-rar ${k==='UR'?'ur-text':''}" data-r="${k}">${k}</div><div class="sp-sub">${SPOT_SUB[k]||''}</div>
    <div class="sp-card">${isNew?`<span class="gnew sp-new">${T('new_card')}</span>`:''}${bigCardHTML(c,isNew)}</div>
    <div class="sp-tap">${(SPOT_TAP[L]||SPOT_TAP.en)}</div></div>`;
  document.body.appendChild(host);setImg(host.querySelector('[data-art]'),c);
  if(S.fx!==false&&typeof fx==='function')try{fx(k,host)}catch(e){}
  const hold={SR:1200,SSR:1800,UR:2400,EXR:3000}[k]||1500;let ok=false;
  setTimeout(()=>{ok=true;host.classList.add('ready')},hold);
  const end=e=>{if(e&&e.target.closest('a'))return;if(!ok)return;host.onclick=null;host.classList.add('out');setTimeout(()=>{host.remove();done()},300)};
  host.onclick=end;
})}

function stampGrid(){const n=S.stamps||0,cyc=Math.floor(Math.max(0,n-1)/25)*25;let h='';

  const box=([a,b])=>`<div class="ntr"><b>${a}</b><p>${b}</p></div>`;
  const host=document.createElement('div');host.className='ov nt-ov';host.id='ntOv';host.style.zIndex=42;
  host.innerHTML=`<div class="ntbox"><div class="nth"><h2>${NTT('t')}</h2><p>${NTT('s')}</p></div>
   <div class="ntb"><div class="ntrules">${box(NTT('r100'))}${box(NTT('rd'))}${box(NTT('r5'))}${box(NTT('r10'))}</div>
    <div class="ntst"><div class="ntst-h"><div><small>${NTT('st')}</small><b>${S.stamps||0}</b></div><div class="ntfb"><small>${NTT('fb')}</small><b class="${black?'bk':''}">${firstDone?NTT('done'):black?NTT('bk'):NTT('rb')}</b></div></div><div class="stgrid">${stampGrid()}</div></div></div>
   <div class="ntf"><label><input type="checkbox" id="ntHide" ${S.noticeHide===today()?'checked':''}> ${NTT('hide')}</label>

function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})}
async function campaignPNG(){const W=1200,H=630,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.fillStyle='#0b0910';x.fillRect(0,0,W,H);
  try{const bg=await loadImg('hero/hero5.webp');const s=Math.max(W/bg.width,H/bg.height);x.globalAlpha=.75;x.drawImage(bg,(W-bg.width*s)/2,(H-bg.height*s)/2,bg.width*s,bg.height*s);x.globalAlpha=1}catch(e){}
  const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(8,6,12,.92)');g.addColorStop(.62,'rgba(8,6,12,.55)');g.addColorStop(1,'rgba(8,6,12,.1)');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='#c9a24a';x.lineWidth=3;x.strokeRect(18,18,W-36,H-36);x.lineWidth=1;x.strokeRect(28,28,W-56,H-56);
  const im=NTT('img'),serif='"Noto Serif TC","Songti TC",serif';
  const gold=x.createLinearGradient(0,90,0,200);gold.addColorStop(0,'#fff1c1');gold.addColorStop(1,'#d9a640');
  x.fillStyle=gold;x.font=`900 92px ${serif}`;x.fillText('MYRIAD',70,150);x.fillText('LEGENDS',70,240);
  x.fillStyle='#f3e6c4';x.font=`700 34px ${serif}`;x.fillText('萬象傳奇錄',74,292);
  x.fillStyle='#ff9ec7';x.font=`900 46px ${serif}`;x.fillText(im[0],70,378);
  x.fillStyle='#fff';x.font=`700 30px ${serif}`;x.fillText(im[1],70,428);
  x.fillStyle='#ffd24a';x.font=`700 28px ${serif}`;x.fillText('★ '+im[2],70,480);
  x.fillStyle='#e8e2d4';x.font=`500 24px ${serif}`;x.fillText(im[3],70,522);
  x.fillStyle='#c9a24a';x.font=`700 30px ui-monospace,monospace`;x.fillText('mylegends.org',70,584);
  // packs on the right
  try{const svgs=['white','gold','rainbow','black'];for(let i=0;i<4;i++){const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(packSVG(svgs[i]).replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '));const p=await loadImg(src);const w=150,h=w*(p.height/p.width||1.6);x.save();x.translate(760+i*95,150+(i%2)*40);x.rotate((i-1.5)*.08);x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=24;x.drawImage(p,0,0,w,h);x.restore()}}catch(e){}
  return new Promise(r=>cv.toBlob(r,'image/png'))}
async function shareCampaign(){const txt=NTT('stxt')+'\n'+SITE_URL;let blob=null;try{blob=await campaignPNG()}catch(e){}
  const file=blob&&new File([blob],'myriad-legends-launch.png',{type:'image/png'});
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:txt,title:'MYRIAD LEGENDS'});return true}catch(e){if(e&&e.name==='AbortError')return false}}
  if(navigator.share&&!file){try{await navigator.share({text:txt,url:SITE_URL,title:'MYRIAD LEGENDS'});return true}catch(e){if(e&&e.name==='AbortError')return false}}
  try{if(file&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);try{await navigator.clipboard.writeText(txt)}catch(e){}toast(NTT('copied'));return true}}catch(e){}
  try{await navigator.clipboard.writeText(txt)}catch(e){prompt('',txt)}
  if(blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='myriad-legends-launch.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
  toast(NTT('copied'));return true}

const RCOLS={C:'#cfc4ae',UC:'#c9d4e6',R:'#5fd18f',SR:'#5aa7ff',SSR:'#ff6b6b',UR:'#ffd24a',EXR:'#c58cff'};
function loadImgX(src){return new Promise((ok,no)=>{const i=new Image();if(!src.startsWith('data:'))i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=no;i.src=src})}
async function artImg(c){try{const u=await imgFor(c);if(!u)return null;return await loadImgX(u)}catch(e){return null}}
function cover(x,img,X,Y,W,H){const s=Math.max(W/img.width,H/img.height),w=img.width*s,h=img.height*s;x.save();x.beginPath();x.rect(X,Y,W,H);x.clip();x.drawImage(img,X+(W-w)/2,Y+(H-h)/2,w,h);x.restore()}
function sealFallback(x,c,X,Y,W,H){const ec={木:'#2e5a37',水:'#1c1f26',火:'#6e2a1f',金:'#5e5a4a',土:'#6a5226'}[c.e]||'#3a2f4d';const g=x.createLinearGradient(0,Y,0,Y+H);g.addColorStop(0,ec);g.addColorStop(1,'#0b0910');x.fillStyle=g;x.fillRect(X,Y,W,H);
  const s=Math.min(W,H)*.42;x.fillStyle='#b8322a';x.fillRect(X+W/2-s/2,Y+H/2-s/2,s,s);x.fillStyle='#fbe9d0';x.font=`900 ${s*.7}px "Noto Serif TC",serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(glyph(c),X+W/2,Y+H/2+2);x.textAlign='left';x.textBaseline='alphabetic'}
function wrapText(x,t,X,Y,maxW,lh,maxL){const out=[];let line='';for(const ch of [...t]){const tt=line+ch;if(x.measureText(tt).width>maxW&&line){out.push(line);line=ch;if(out.length>=maxL)break}else line=tt}if(out.length<maxL&&line)out.push(line);if(out.length===maxL&&line&&out[maxL-1]!==line)out[maxL-1]=out[maxL-1].replace(/.$/,'…');out.forEach((l,i)=>x.fillText(l,X,Y+i*lh))}
async function frameBase(){const W=1200,H=630,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');x.fillStyle='#0b0910';x.fillRect(0,0,W,H);
  try{const bg=await loadImg('hero/hero3.webp');x.globalAlpha=.35;cover(x,bg,0,0,W,H);x.globalAlpha=1}catch(e){}
  x.fillStyle='rgba(8,6,12,.55)';x.fillRect(0,0,W,H);x.strokeStyle='#c9a24a';x.lineWidth=3;x.strokeRect(14,14,W-28,H-28);return {cv,x,W,H}}
function brand(x,W,H){const serif='"Noto Serif TC",serif';x.fillStyle='#e9c46a';x.font=`900 30px ${serif}`;x.fillText('MYRIAD LEGENDS · 萬象傳奇錄',40,64);x.fillStyle='#c9a24a';x.font=`700 24px ui-monospace,monospace`;x.textAlign='right';x.fillText('mylegends.org',W-40,H-34);x.textAlign='left'}
async function resultPNG(res){const {cv,x,W,H}=await frameBase();brand(x,W,H);const serif='"Noto Serif TC",serif';
  const tw=172,th=330,gap=14,x0=(W-(6*tw+5*gap))/2,y0=120;const arts=await Promise.all(res.map(r=>artImg(r.c)));
  res.slice(0,6).forEach(({c,isNew},i)=>{const X=x0+i*(tw+gap),col=RCOLS[c.y]||'#ccc';
    x.fillStyle='#15121c';x.fillRect(X,y0,tw,th);x.strokeStyle=col;x.lineWidth=RAR.indexOf(c.y)>=3?5:2;x.strokeRect(X,y0,tw,th);
    if(RAR.indexOf(c.y)>=3){x.save();x.shadowColor=col;x.shadowBlur=30;x.strokeRect(X,y0,tw,th);x.restore()}
    const a=arts[i];if(a)cover(x,a,X+8,y0+44,tw-16,200);else sealFallback(x,c,X+8,y0+44,tw-16,200);
    x.fillStyle=col;x.font=`900 26px ${serif}`;x.fillText(c.y,X+10,y0+32);if(isNew){x.fillStyle='#ff9a2a';x.font='800 15px sans-serif';x.textAlign='right';x.fillText('NEW',X+tw-10,y0+28);x.textAlign='left'}
    x.fillStyle='#fff';x.font=`700 19px ${serif}`;wrapText(x,nm(c),X+10,y0+272,tw-20,24,2);
    x.fillStyle='#a9a290';x.font='600 14px sans-serif';x.fillText(`ATK ${c.a.toLocaleString()} / DEF ${c.d.toLocaleString()}`,X+10,y0+th-12)});
  const best=res.reduce((a,r)=>RAR.indexOf(r.c.y)>RAR.indexOf(a.c.y)?r:a,res[0]);x.fillStyle=RCOLS[best.c.y];x.font=`900 34px ${serif}`;x.fillText(`${best.c.y} ${nm(best.c)}`,40,H-36);
  return new Promise(r=>cv.toBlob(r,'image/png'))}
async function cardPNG(c){const {cv,x,W,H}=await frameBase();brand(x,W,H);const serif='"Noto Serif TC",serif',col=RCOLS[c.y]||'#ccc';
  const a=await artImg(c);const AX=60,AY=100,AW=400,AH=470;x.save();x.shadowColor=col;x.shadowBlur=40;x.fillStyle='#000';x.fillRect(AX,AY,AW,AH);x.restore();if(a)cover(x,a,AX,AY,AW,AH);else sealFallback(x,c,AX,AY,AW,AH);x.strokeStyle=col;x.lineWidth=5;x.strokeRect(AX,AY,AW,AH);
  const TX=510;x.fillStyle=col;x.font=`900 96px ${serif}`;x.fillText(c.y,TX,190);
  x.fillStyle='#fff';x.font=`900 50px ${serif}`;wrapText(x,nm(c),TX,262,640,58,2);
  x.fillStyle='#d9c9a0';x.font=`600 24px ${serif}`;x.fillText([c.r?raceName(c.r):'',kindName(c.k),c.e?elName(c.e):''].filter(Boolean).join(' · ')+`  #${c.i}`,TX,370);
  x.fillStyle='#ffd24a';x.font=`800 32px sans-serif`;x.fillText(`ATK ${c.a.toLocaleString()}   DEF ${c.d.toLocaleString()}`,TX,422);
  x.fillStyle='#c9c2b0';x.font=`500 22px ${serif}`;wrapText(x,dx(c)||'',TX,470,640,32,3);
  return new Promise(r=>cv.toBlob(r,'image/png'))}
async function shareBlob(blob,txt,fname){const file=blob&&new File([blob],fname,{type:'image/png'});
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:txt,title:'MYRIAD LEGENDS'});return true}catch(e){if(e&&e.name==='AbortError')return false}}
  try{if(blob&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);toast(NTT('copied'));return true}}catch(e){}
  if(blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
  try{await navigator.clipboard.writeText(txt)}catch(e){}toast(NTT('copied'));return true}

/* merge another save into S (card counts never go down, so max() is safe) */
function mergeSave(sv){if(!sv||typeof sv.owned!=='object')return false;
  for(const[k,v]of Object.entries(sv.owned)){S.owned[k]=Math.max(S.owned[k]||0,v);if(sv.order&&sv.order[k]!=null&&S.order[k]==null)S.order[k]=sv.order[k]}
  Object.assign(S.fav,sv.fav||{});for(const[g,ids]of Object.entries(sv.groups||{}))S.groups[g]=[...new Set([...(S.groups[g]||[]),...ids])];
  S.pulls=Math.max(S.pulls,sv.pulls||0);S.packsOpened=Math.max(S.packsOpened,sv.packsOpened||0);S.stamps=Math.max(S.stamps||0,sv.stamps||0);
  Object.assign(S.trophies,sv.trophies||{});if(sv.story&&(sv.story.stage||0)>(S.story.stage||0))S.story=sv.story;
  if(sv.boss&&(sv.boss.kills||0)>(S.boss.kills||0))S.boss.kills=sv.boss.kills;
  if(Array.isArray(sv.showcase)&&!S.showcase.length)S.showcase=sv.showcase;return true}

function cxRows(){
  let list=Object.keys(S.owned).map(i=>BYID[i]).filter(Boolean);

  if(cx.race!=='all')list=list.filter(c=>c.r===cx.race);
  if(cx.el!=='all'){const f=CX_ELS.find(x=>x[0]===cx.el);if(f)list=list.filter(f[1])}
  if(cx.group!=='all')list=list.filter(c=>(S.groups[cx.group]||[]).includes(c.i));
  const q=cx.q.trim().toLowerCase();if(q)list=list.filter(c=>Object.values(c.n).some(v=>v&&v.toLowerCase().includes(q)));
  const qc=cx.qc.trim().toLowerCase();if(qc)list=list.filter(c=>[raceName(c.r),kindName(c.k),...(c.t||[])].join(' ').toLowerCase().includes(qc));
  const key={rarity:c=>RAR.indexOf(c.y)*1e6+c.f,cat:c=>c.k+(c.r||''),name:c=>nm(c),id:c=>c.i,atk:c=>c.a,def:c=>c.d,sum:c=>c.a+c.d,count:c=>S.owned[c.i],order:c=>S.order[c.i]??0}[cx.sort];
  list.sort((a,b)=>{const x=key(a),y=key(b);return (x>y?1:x<y?-1:0)*cx.dir});
  const per=100,pages=Math.max(1,Math.ceil(list.length/per));cx.page=Math.min(cx.page,pages);
  const rows=list.slice((cx.page-1)*per,cx.page*per);
  $('#pager').innerHTML=`<span class="muted">${T('page')}</span><input class="inp" id="pg" type="number" min="1" max="${pages}" value="${cx.page}"><span class="muted">/ ${pages}</span>`;
  $('#pg').onchange=e=>{cx.page=Math.max(1,Math.min(pages,+e.target.value||1));cxRows()};
  {const P=cx.page,nums=[...new Set([1,P-2,P-1,P,P+1,P+2,pages])].filter(n=>n>=1&&n<=pages).sort((a,b)=>a-b);let h=`<button class="chip" data-pg="${P-1}" ${P<=1?'disabled':''}>‹ ${FT(3)}</button>`,last=0;
   for(const n of nums){if(n-last>1)h+='<span class="muted">…</span>';h+=`<button class="chip" data-pg="${n}" aria-pressed="${n===P}">${n}</button>`;last=n}
   h+=`<button class="chip" data-pg="${P+1}" ${P>=pages?'disabled':''}>${FT(4)} ›</button><span class="muted" style="margin-left:6px">${list.length.toLocaleString()}</span>`;
   $('#pager2').innerHTML=h;$('#pager2').querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{cx.page=+b.dataset.pg;cxRows();$('.tblwrap').scrollIntoView({block:'start'})})}
  $('#tb').innerHTML=rows.length?rows.map(c=>`<tr data-id="${c.i}"><td><b class="rb r-${c.y}">${c.y}</b></td><td style="color:#e9a23b">${c.f.toFixed(1)}</td>
    <td><button class="star ${S.fav[c.i]?'on':''}" data-fav="${c.i}" aria-label="${T('fav')}">${S.fav[c.i]?'★':'☆'}</button></td>

      <div style="display:flex;gap:4px;flex-wrap:wrap">${c.r?raceBadge(c.r,20):''}<span class="tag">${kindName(c.k)}</span></div></div></div></td>
    <td class="num">${c.a.toLocaleString()}</td><td class="num">${c.d.toLocaleString()}</td><td class="num muted">×${S.owned[c.i]}</td></tr>`).join('')

function raceMult(a,d){return 1}
function cardMult(x,y){return elemMult(x.e,y.e)*gdMult(x.r,y.r)}
function leaderBonus(lead,c){const l=lead&&lead.ls;if(!hasLS(lead))return 0;const p=l[2]/100;switch(l[0]){case 't':return (c.t||[]).includes(l[1])?p:0;case 'r':return c.r===l[1]?p:0;case 'e':return c.e===l[1]?p:0;case 'er':return (c.e===l[1][0]||c.r===l[1][1])?p:0}return 0}
function fieldEffect(f){if(!f)return null;const r=RACES[f.i%7];return {race:r,atk:.10,text:`${RI(r)} ATK +10%`}}
function fighter(c,opt={}){
  let atk=c.a,def=c.d;
  const lv=(opt.lv||0);atk*=1+lv*.05;def*=1+lv*.05;
  if(opt.eq){const ids=typeof opt.eq==='object'?Object.values(opt.eq):[opt.eq];const m=ids.length>1?.2:.3;for(const id of ids){const e=BYID[id];if(e){atk+=e.a*m;def+=e.d*m}}}
  if(opt.atkB)atk*=1+opt.atkB;
  if(opt.lead){const b=leaderBonus(opt.lead,c);atk*=1+b;if(opt.lead.ls&&opt.lead.ls[0]==='r')def*=1+b}
  if(opt.field&&opt.field.race===c.r)atk*=1+opt.field.atk;
  return {c,atk,def,hp:Math.round(1200+def*1.2),max:Math.round(1200+def*1.2)};
}
function duel(A,B){
  let turns=0;const log=[];
  while(A.hp>0&&B.hp>0&&turns<30){
    turns++;
    for(const [x,y] of [[A,B],[B,A]]){if(x.hp<=0||y.hp<=0)continue;
      const m=cardMult(x.c,y.c);const crit=Math.random()<.1;const k=SKILLS_ON?x.c.sk:null;let sp=null,mul=1,ign=false;
      if(k&&Math.random()<.25){sp=k[0];
        if(sp==='aoe')mul=k[1]/100;else if(sp==='one'){mul=k[1]/100;ign=Math.random()*100<k[2]}else if(sp==='pierce')mul=(KE5[x.c.e]===y.c.e?k[2]:k[1])/100;
        else if(sp==='buf'){x.atk*=1+k[1]/100}else if(sp==='heal'){x.hp=Math.min(x.max,x.hp+Math.round(x.max*k[1]/100))}}
      const dmg=Math.max(40,Math.round((x.atk*.32-(ign?0:y.def*.06))*m*mul*(crit?1.6:1)*(.85+Math.random()*.3)));
      y.hp=Math.max(0,y.hp-dmg);log.push({x,y,dmg,m,crit,hp:y.hp,sp});}
  }
  const res=A.hp>0&&B.hp<=0?'win':B.hp>0&&A.hp<=0?'lose':(A.hp/A.max>B.hp/B.max?'win':A.hp/A.max<B.hp/B.max?'lose':'draw');
  return {res,turns,log};
}

function teamBonds(cards){
  const out=[];const races={};cards.forEach(c=>{if(c&&c.r)races[c.r]=(races[c.r]||0)+1});
  for(const r in races){if(races[r]>=5)out.push({atk:.10,text:`${RI(r)} ×5 +10%`,race:r});else if(races[r]>=3)out.push({atk:.05,text:`${RI(r)} ×3 +5%`,race:r})}
  for(const [th,b] of Object.entries(THEME_BONDS)){const n=cards.filter(c=>c&&(c.t||[]).includes(th)).length;if(n>=b.need)out.push({atk:b.atk,text:`${T('bond')} ${th} +${Math.round(b.atk*100)}%`,theme:th})}
  const els={};cards.forEach(c=>{if(c&&c.e)els[c.e]=(els[c.e]||0)+1});
  for(const e in els){if(els[e]>=5)out.push({atk:.15,text:`${elName(e)} ×5 +15%`,el:e});else if(els[e]>=3)out.push({atk:.06,text:`${elName(e)} ×3 +6%`,el:e})}
  if(Object.keys(els).length===5)out.push({atk:.12,text:`${T('wuxing_all')||'五行俱全'} +12%`,all:true});
  const gd=cards.filter(c=>c&&(c.r==='神'||c.r==='魔'));if(gd.length>=2&&gd.every(c=>c.r===gd[0].r))out.push({atk:.08,text:`${RI(gd[0].r)} ×${gd.length} +8%`,race:gd[0].r});
  const SH={'木':'火','火':'土','土':'金','金':'水','水':'木'};
  for(let i=0;i<4;i++){const a=cards[i],b=cards[i+1];if(a&&b&&a.e&&SH[a.e]===b.e)out.push({atk:.08,text:`${elName(a.e)}→${elName(b.e)} +8%`,slot:i+1})}
  return out;
}

  const f=o.f!=null&&BYID[o.f]&&(BYID[o.f].k==='battle'||BYID[o.f].k==='realm')?o.f:null;return {cards,eq,field:f}}catch(e){return null}}

function bBoss(){

    bindBack();hydrateMinis($('#app'));
    $('#all50').onclick=()=>{party=chars.slice(0,50).map(c=>c.i);draw()};
    $('#app').querySelectorAll('.picker .mini').forEach(m=>m.onclick=()=>{const i=+m.dataset.id;const k=party.indexOf(i);if(k>=0)party.splice(k,1);else if(party.length<50)party.push(i);draw()});
    $('#go').onclick=async()=>{const ar=$('#ar');ar.style.display='block';let total=0;S.boss.tries--;
      for(const id of party){const c=BYID[id];const m=raceMult(c.r,boss.r);const dmg=Math.round((c.a*2.2+c.d*.4)*m*(.9+Math.random()*.2));total+=dmg;
        ar.insertAdjacentHTML('beforeend',`<p class="${m>1?'adv':m<1?'dis':''}">${esc(nm(c))} -${dmg.toLocaleString()}</p>`);ar.scrollTop=ar.scrollHeight;await sleep(60)}

      record('boss',`${T('boss')}: ${nm(boss)}`,boss.y,killed?'win':'draw',1,party.slice(0,5));save();trophyCheck();
      ar.insertAdjacentHTML('beforeend',`<p class="adv"><b>Σ ${total.toLocaleString()}</b></p>`);setTimeout(draw,1500)};
  };draw();
}

}

function ownedName(n){return CARDS.some(c=>(c.n.h===n||c.n.s===n)&&S.owned[c.i])}
function packTrophies(cards){
  const ys=cards.map(c=>c.y);const cnt={};ys.forEach(y=>cnt[y]=(cnt[y]||0)+1);const v=Object.values(cnt).sort();
  if(ys.every(y=>y==='C'))S.trophies._allc=1;if(ys.every(y=>y==='UC'))S.trophies._alluc=1;
  if(ys.filter(y=>RAR.indexOf(y)>=4).length>=2)S.trophies._two=1;if(ys.filter(y=>RAR.indexOf(y)>=5).length>=2)S.trophies._ur2=1;if(ys.filter(y=>y==='EXR').length>=2)S.trophies._lr2=1;if(new Set(ys).size>=5)S.trophies._rainbow=1;if(v.join()==='3,3')S.trophies._full=1;
  trophyCheck();
}
function trophyCheck(){
  const ids=Object.keys(S.owned);const X={o:ids.length,r:{},n:{},m:0,cTotal:0,atk:0,def:0,cards:[]};
  for(const i of ids){const c=BYID[i];if(!c)continue;X.cards.push(c);X.r[c.y]=true;X.n[c.y]=(X.n[c.y]||0)+1;X.m=Math.max(X.m,S.owned[i]);if(c.y==='C')X.cTotal+=S.owned[i];X.atk=Math.max(X.atk,c.a);X.def=Math.max(X.def,c.d)}
  X.any=f=>X.cards.some(f);
  if(S.trophies._wins==null)S.trophies._wins=S.records.filter(r=>r.res==='win').length;
  for(const [id,name,,fn] of TROPHIES){if(!S.trophies[id]){let ok=false;try{ok=fn(S,X)}catch(e){}if(ok){S.trophies[id]=Date.now();toast('🏆 '+name)}}}
  save();
}
function showTrophies(){
  trophyCheck();const got=TROPHIES.filter(t=>S.trophies[t[0]]).length;const next=TROPHIES.find(t=>!S.trophies[t[0]]&&!t[5]);
  const host=document.createElement('div');host.className='ov';host.style.zIndex=40;
  host.innerHTML=`<div class="box" style="max-width:860px"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">🏆 ${T('trophies')}</h2><button class="btn ghost" data-x>${T('close')}</button></div>
   <p>${T('trophies_d')(got,TROPHIES.length)}</p><div class="bar"><i style="width:${got/TROPHIES.length*100}%"></i></div>
   ${next?`<p class="muted" style="font-size:13px">${T('next_goal')}: <b style="color:var(--ink)">${next[1]}</b> · ${next[2]}</p>`:''}
   <div class="troph">${TROPHIES.map(([id,name,desc,,ic,sec])=>{const on=S.trophies[id];return `<div class="${on?'on':''}"><span class="tic">${on||!sec?ic:'❔'}</span><span><b>${on||!sec?name:'？？？？？'}</b>${on||!sec?desc:'獲得條件仍是個謎……'}</span>${on?'<em>已獲得</em>':''}</div>`}).join('')}</div></div>`;
  document.body.appendChild(host);host.onclick=e=>{if(e.target===host||e.target.closest('[data-x]'))host.remove()};
}
